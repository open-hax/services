# Canonical Promethean ingress map.
# This file is intended to be mounted into the knoxx-nginx nginx:1.27 container.
# It owns public hostname routing only; app containers own app behavior.

proxy_read_timeout 900s;
proxy_send_timeout 900s;
proxy_connect_timeout 30s;

# HTTP -> HTTPS redirect for one-level *.promethean.rest hosts covered by the wildcard cert.
server {
    listen 80;
    server_name knoxx.promethean.rest proxx.promethean.rest openplanner.promethean.rest axxium.promethean.rest staging-knoxx.promethean.rest staging-openplanner.promethean.rest;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Staging Proxx federation node subdomains are HTTP because a wildcard cert for *.promethean.rest does not cover a1.staging-proxx.promethean.rest.
server {
    listen 80;
    server_name staging-proxx.promethean.rest *.staging-proxx.promethean.rest;

    location ~ ^/(api/ui/federation|v1/stream) {
        proxy_pass http://host.docker.internal:8890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://host.docker.internal:8890;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Authorization $http_authorization;
    }
}

server {
    listen 443 ssl;
    server_name knoxx.promethean.rest;

    ssl_certificate /etc/letsencrypt/live/promethean.rest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promethean.rest/privkey.pem;

    location /ws/ {
        proxy_pass http://frontend:80/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }
}


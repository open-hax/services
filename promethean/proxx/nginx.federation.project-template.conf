worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=30s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream federation_cluster_api {
    # Pin the public/default cluster path to a single witness node.
    # Shared-SQL federation still leaves some operator surfaces runtime-local,
    # so round-robining public traffic between A1 and A2 can make the UI
    # appear to flap between different account/session views.
    server {{PROJECT}}-federation-proxx-a1-1:8789;
    server {{PROJECT}}-federation-proxx-a2-1:8789 backup;
  }

  upstream federation_group_a_api {
    server {{PROJECT}}-federation-proxx-a1-1:8789;
    server {{PROJECT}}-federation-proxx-a2-1:8789;
  }

  upstream federation_group_b_api {
    server {{PROJECT}}-federation-proxx-b1-1:8789;
    server {{PROJECT}}-federation-proxx-b2-1:8789;
  }

  upstream federation_node_a1_api { server {{PROJECT}}-federation-proxx-a1-1:8789; }
  upstream federation_node_a2_api { server {{PROJECT}}-federation-proxx-a2-1:8789; }
  upstream federation_node_b1_api { server {{PROJECT}}-federation-proxx-b1-1:8789; }
  upstream federation_node_b2_api { server {{PROJECT}}-federation-proxx-b2-1:8789; }

  upstream federation_cluster_web {
    server {{PROJECT}}-federation-proxx-a1-1:5174;
    server {{PROJECT}}-federation-proxx-a2-1:5174 backup;
  }

  upstream federation_group_a_web {
    server {{PROJECT}}-federation-proxx-a1-1:5174;
    server {{PROJECT}}-federation-proxx-a2-1:5174;
  }

  upstream federation_group_b_web {
    server {{PROJECT}}-federation-proxx-b1-1:5174;
    server {{PROJECT}}-federation-proxx-b2-1:5174;
  }

  upstream federation_node_a1_web { server {{PROJECT}}-federation-proxx-a1-1:5174; }
  upstream federation_node_a2_web { server {{PROJECT}}-federation-proxx-a2-1:5174; }
  upstream federation_node_b1_web { server {{PROJECT}}-federation-proxx-b1-1:5174; }
  upstream federation_node_b2_web { server {{PROJECT}}-federation-proxx-b2-1:5174; }

  # Route by normalized host instead of $http_host so node-specific
  # federation hosts still match when clients/proxies include a port.
  #
  # Keep variable proxy_pass targets as concrete Docker DNS names. Nginx can
  # select static upstream groups with proxy_pass, but upstream-group names
  # stored in variables are not reliable across reloads in the containerized
  # resolver path.
  map $host $federation_api_upstream {
    default {{PROJECT}}-federation-proxx-a1-1:8789;
    ~^group-a\. {{PROJECT}}-federation-proxx-a1-1:8789;
    ~^group-b\. {{PROJECT}}-federation-proxx-b1-1:8789;
    ~^a1\. {{PROJECT}}-federation-proxx-a1-1:8789;
    ~^a2\. {{PROJECT}}-federation-proxx-a2-1:8789;
    ~^b1\. {{PROJECT}}-federation-proxx-b1-1:8789;
    ~^b2\. {{PROJECT}}-federation-proxx-b2-1:8789;
  }

  map $host $federation_web_upstream {
    default {{PROJECT}}-federation-proxx-a1-1:5174;
    ~^group-a\. {{PROJECT}}-federation-proxx-a1-1:5174;
    ~^group-b\. {{PROJECT}}-federation-proxx-b1-1:5174;
    ~^a1\. {{PROJECT}}-federation-proxx-a1-1:5174;
    ~^a2\. {{PROJECT}}-federation-proxx-a2-1:5174;
    ~^b1\. {{PROJECT}}-federation-proxx-b1-1:5174;
    ~^b2\. {{PROJECT}}-federation-proxx-b2-1:5174;
  }

  server {
    listen 80;
    server_name _;

    location ~ ^/(v1|api|auth|health) {
      proxy_pass http://$federation_api_upstream;
      proxy_http_version 1.1;
      proxy_pass_request_headers on;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 30s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
    }

    location / {
      proxy_pass http://$federation_web_upstream;
      proxy_http_version 1.1;
      proxy_pass_request_headers on;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
    }
  }
}

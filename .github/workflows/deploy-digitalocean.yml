name: Deploy to DigitalOcean

# Deploys one service to the DigitalOcean production host.
#
# The host address, SSH user, and runtime/state roots come from
# digitalocean/hosts/<environment>.yaml via digitalocean/lib/host-contract.sh.
# Nothing here defaults to a home directory, and every SSH connection is
# checked against the committed host key before it is made.
#
# Each service contributes three files under digitalocean/services/<service>/:
#   compose.yaml   the runtime topology, referencing GHCR images
#   env.template   the secret/variable contract, placeholders only
#   verify.sh      the post-deploy health gate, run on the host

on:
  workflow_call:
    inputs:
      service:
        description: Service to deploy
        required: true
        type: string
      environment:
        description: Target environment
        required: false
        default: production
        type: string
      image:
        description: Fully qualified image reference to deploy
        required: false
        default: ""
        type: string
      source_sha:
        description: Application source commit being deployed
        required: false
        default: ""
        type: string
      extra_env:
        description: >-
          Additional non-secret NAME=value pairs as a JSON object, exported
          before the env template is rendered. Used for services that deploy
          more than one image.
        required: false
        default: "{}"
        type: string
    secrets:
      DIGITALOCEAN_SSH_PRIVATE_KEY: { required: true }
      MONGODB_URI: { required: false }
      REQUESTY_API_KEY: { required: false }
      DO_INFERENCE_API_KEY: { required: false }
      PROXY_AUTH_TOKEN: { required: false }
      PROXY_TOKEN_PEPPER: { required: false }
      PROXX_SESSION_SECRET: { required: false }
      PROXX_POSTGRES_PASSWORD: { required: false }
      KNOXX_API_KEY: { required: false }
      KNOXX_SESSION_SECRET: { required: false }
      KNOXX_MCP_LOOPBACK_TOKEN: { required: false }
      KNOXX_GITHUB_OAUTH_CLIENT_ID: { required: false }
      KNOXX_GITHUB_OAUTH_CLIENT_SECRET: { required: false }
      CADDY_ACME_EMAIL: { required: false }
      DEV_BASIC_AUTH_USER: { required: false }
      DEV_BASIC_AUTH_HASH: { required: false }
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        type: choice
        options: [smoke, proxx, knoxx, caddy, website]
      environment:
        description: Target environment
        required: false
        default: production
        type: string
      image:
        description: Fully qualified image reference to deploy
        required: false
        default: ""
        type: string
      extra_env:
        description: Additional non-secret NAME=value pairs as a JSON object
        required: false
        default: "{}"
        type: string

permissions:
  contents: read

concurrency:
  group: digitalocean-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Load and validate host contract
        id: contract
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          . digitalocean/lib/host-contract.sh
          load_host_contract "$DEPLOY_ENVIRONMENT"
          assert_pinned_host_key

          dir="digitalocean/services/${SERVICE}"
          for required in compose.yaml env.template verify.sh; do
            test -f "${dir}/${required}" || {
              echo "service ${SERVICE} is missing ${dir}/${required}" >&2
              exit 2
            }
          done
          if [ "$SERVICE" = knoxx ]; then
            test -f "${dir}/post-deploy.sh" || {
              echo "service knoxx is missing ${dir}/post-deploy.sh" >&2
              exit 2
            }
            for helper in event-agent-limits.sh mongodb-database-identity.sh probe-embedding-migration.js probe-mcp.js probe-ollama.js; do
              test -f "${dir}/${helper}" || {
                echo "service knoxx is missing ${dir}/${helper}" >&2
                exit 2
              }
            done
          fi

          {
            echo "host=${OPEN_HAX_HOST}"
            echo "ssh_user=${OPEN_HAX_SSH_USER}"
            echo "service_dir=${dir}"
            echo "runtime_path=$(service_runtime_path "$SERVICE")"
            echo "state_path=$(service_state_path "$SERVICE")"
            echo "state_root=${OPEN_HAX_STATE_ROOT}"
            echo "reports_root=${OPEN_HAX_REPORTS_ROOT}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DIGITALOCEAN_SSH_PRIVATE_KEY }}
          HOST: ${{ steps.contract.outputs.host }}
          SSH_USER: ${{ steps.contract.outputs.ssh_user }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean
          install -m 600 "digitalocean/known_hosts/${DEPLOY_ENVIRONMENT}" ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          cat > ~/.ssh/config <<EOF
          Host open-hax-target
            HostName $HOST
            User $SSH_USER
            IdentityFile ~/.ssh/digitalocean
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify Caddy dev-ingress firewall boundary
        if: inputs.service == 'caddy'
        run: |
          set -euo pipefail
          ssh open-hax-target \
            'sudo -n /usr/local/sbin/open-hax-verify-dev-ingress-firewall'

      - name: Render runtime environment
        env:
          # The auth resolver branches by service before rendering. Keep the
          # stable workflow input explicit instead of relying on ambient shell
          # state; reusable-workflow jobs do not inherit caller variables.
          SERVICE: ${{ inputs.service }}
          SERVICE_DIR: ${{ steps.contract.outputs.service_dir }}
          # Non-secret runtime facts.
          OPEN_HAX_SERVICE_IMAGE: ${{ inputs.image }}
          OPEN_HAX_SOURCE_SHA: ${{ inputs.source_sha }}
          OPEN_HAX_STATE_PATH: ${{ steps.contract.outputs.state_path }}
          # stateRoot itself, for the one kind of path a per-service state path
          # cannot express: a directory SHARED between two services, where one
          # writes and the other reads. The published content root is
          # <stateRoot>/website-content, a peer of state/knoxx and
          # state/website rather than a child of either, so both services must
          # be able to name it identically. See docs/published-content-root.md.
          OPEN_HAX_STATE_ROOT: ${{ steps.contract.outputs.state_root }}
          OPEN_HAX_HOST_ADDRESS: ${{ steps.contract.outputs.host }}
          KNOXX_API_KEY_USER_EMAIL: ${{ vars.KNOXX_API_KEY_USER_EMAIL }}
          # Secrets. Absent ones stay empty and are caught by the placeholder
          # check below rather than silently deploying a blank credential.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          DO_INFERENCE_API_KEY: ${{ secrets.DO_INFERENCE_API_KEY }}
          PROXY_AUTH_TOKEN: ${{ secrets.PROXY_AUTH_TOKEN }}
          PROXY_TOKEN_PEPPER: ${{ secrets.PROXY_TOKEN_PEPPER }}
          PROXX_SESSION_SECRET: ${{ secrets.PROXX_SESSION_SECRET }}
          PROXX_POSTGRES_PASSWORD: ${{ secrets.PROXX_POSTGRES_PASSWORD }}
          KNOXX_API_KEY: ${{ secrets.KNOXX_API_KEY }}
          KNOXX_SESSION_SECRET: ${{ secrets.KNOXX_SESSION_SECRET }}
          # Mandatory for Knoxx. The render step applies the same minimum
          # length policy as the host-side post-deploy verifier.
          KNOXX_MCP_LOOPBACK_TOKEN: ${{ secrets.KNOXX_MCP_LOOPBACK_TOKEN }}
          KNOXX_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.KNOXX_GITHUB_OAUTH_CLIENT_ID }}
          KNOXX_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.KNOXX_GITHUB_OAUTH_CLIENT_SECRET }}
          # Let's Encrypt expiry contact. No longer borrowed from
          # KNOXX_API_KEY_USER_EMAIL, which now names a service identity nobody
          # reads mail for. A secret rather than a variable because this repo is
          # public and Actions prints non-secret vars verbatim into run logs.
          CADDY_ACME_EMAIL: ${{ secrets.CADDY_ACME_EMAIL }}
          # All dev ingress is one host-level trust boundary. A provisioned pair
          # is preserved; an absent pair is replaced below with a one-deploy,
          # unknowable credential so the routes remain closed by default.
          DEV_BASIC_AUTH_USER: ${{ secrets.DEV_BASIC_AUTH_USER }}
          DEV_BASIC_AUTH_HASH: ${{ secrets.DEV_BASIC_AUTH_HASH }}
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          set -euo pipefail
          # Caddy's dev vhosts must never become public merely because a
          # fresh environment has not provisioned operator credentials yet.
          # Preserve a complete configured pair; reject a partial pair; and
          # otherwise generate a valid bcrypt hash for a random password that
          # is immediately discarded. The resulting auth wall is intentionally
          # unusable until the environment supplies real credentials.
          . digitalocean/lib/caddy-dev-auth.sh
          resolve_caddy_dev_auth "$SERVICE" "$SERVICE_DIR"
          if [ "$SERVICE" = caddy ]; then
            echo "::add-mask::${DEV_BASIC_AUTH_HASH}"
          fi

          # Knoxx deploys always verify their MCP server. A missing/short
          # credential stops rendering before anything is copied to the host.
          # Other service templates do not declare this variable.
          if [ "$SERVICE" = knoxx ]; then
            . "${SERVICE_DIR}/mcp-verification-policy.sh"
            require_knoxx_mcp_verification_token
          fi
          # Process substitution keeps the loop in this shell so the exports
          # survive into envsubst. The MCP token is refused rather than
          # exported: it comes only from the protected environment secret, and
          # allowing a caller to shadow it would weaken the mandatory gate.
          while IFS='=' read -r key value; do
            [ -n "$key" ] || continue
            case "$key" in
              KNOXX_MCP_LOOPBACK_TOKEN)
                echo "::error::extra_env may not set ${key}; it is supplied only by the protected environment secret" >&2
                exit 2
                ;;
            esac
            export "$key=$value"
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"${EXTRA_ENV:-\{\}}")

          # Substitute only the names the template declares, so nginx/caddy
          # style $variables in adjacent config survive untouched. grep already
          # yields the ${NAME} form that envsubst wants as SHELL-FORMAT.
          mapfile -t declared < <(grep -oE '\$\{[A-Z0-9_]+\}' "${SERVICE_DIR}/env.template" | sort -u)
          envsubst "${declared[*]}" < "${SERVICE_DIR}/env.template" > rendered.env

          # An unset secret renders as `NAME=''` — refuse rather than deploy a
          # blank credential into production.
          if grep -nE "^[A-Z0-9_]+=''$" rendered.env; then
            echo "::error::the above variables rendered empty; check the ${{ inputs.environment }} environment" >&2
            exit 2
          fi

          # Templates single-quote every value so the file is parseable both by
          # docker compose --env-file (which strips the quotes) and by `.` in
          # the health gate. A value containing a single quote would break the
          # latter, so reject it rather than ship a mis-parsed credential.
          if grep -nE "^[A-Z0-9_]+='.*'.*'" rendered.env; then
            echo "::error::the above values contain a single quote, which the env file cannot represent" >&2
            exit 2
          fi

          chmod 600 rendered.env
          echo "rendered $(grep -cE '^[A-Z0-9_]+=' rendered.env) variables"

      - name: Authenticate the host to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          # Short-lived, job-scoped: the images are private to the org and the
          # Droplet holds no standing registry credential.
          printf '%s' "$REGISTRY_TOKEN" \
            | ssh open-hax-target "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin" >/dev/null

      - name: Verify Knoxx embedding cutover
        id: embedding_migration
        if: inputs.service == 'knoxx'
        env:
          SERVICE: ${{ inputs.service }}
          SERVICE_DIR: ${{ steps.contract.outputs.service_dir }}
        run: |
          set -euo pipefail
          probe_dir=$(ssh open-hax-target 'mktemp -d /tmp/open-hax-knoxx-migration.XXXXXX')
          case "$probe_dir" in
            /tmp/open-hax-knoxx-migration.*) ;;
            *) echo "unexpected remote probe path: $probe_dir" >&2; exit 2 ;;
          esac
          cleanup_probe() {
            ssh open-hax-target "rm -rf '$probe_dir'" >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT
          scp rendered.env "${SERVICE_DIR}/probe-embedding-migration.js" \
            "${SERVICE_DIR}/mongodb-database-identity.sh" \
            "open-hax-target:${probe_dir}/"

          # Inventory runs in the prospective backend image before the new
          # environment or service definition replaces the live deployment.
          # An unchanged target can redeploy normally. A genuine 1024 -> 768
          # cutover is permitted only when there is no prior backend contract
          # and the store is fresh; populated state awaits an authoritative
          # Knoxx/OpenPlanner migration verifier.
          ssh open-hax-target \
            "bash -euo pipefail -s -- '$probe_dir' '$SERVICE'" <<'REMOTE'
          {
          probe_dir=$1
          service=$2
          probe_container="open-hax-${service}-embedding-migration"
          cleanup_remote_probe() {
            docker rm -f "$probe_container" >/dev/null 2>&1 || true
            rm -rf "$probe_dir"
          }
          trap cleanup_remote_probe EXIT
          chmod 600 "$probe_dir/rendered.env" "$probe_dir/mongodb-database-identity.sh"
          set -a; . "$probe_dir/rendered.env"; set +a
          # shellcheck source=/dev/null
          . "$probe_dir/mongodb-database-identity.sh"

          current_backends_output=$(
            docker ps --all \
              --filter "label=com.docker.compose.project=${service}" \
              --filter 'label=com.docker.compose.service=knoxx-backend' \
              --format '{{.ID}}'
          )
          current_backends=()
          if [ -n "$current_backends_output" ]; then
            mapfile -t current_backends <<<"$current_backends_output"
          fi
          if [ "${#current_backends[@]}" -gt 1 ]; then
            echo "embedding migration gate found multiple Knoxx backend contracts" >&2
            exit 1
          fi

          export EMBED_SOURCE_CONTRACT_PRESENT=0
          export EMBED_SOURCE_WRITER_ACTIVE=0
          export EMBED_SOURCE_MODEL=
          export EMBED_SOURCE_DIMENSIONS=
          export EMBED_SOURCE_DATABASE_FINGERPRINT=
          if ! EMBED_TARGET_DATABASE_FINGERPRINT=$(
              mongodb_database_fingerprint "$MONGODB_URI" "$MONGODB_DB"
            ); then
            echo "embedding migration gate rejected target Mongo database identity" >&2
            exit 1
          fi
          export EMBED_TARGET_DATABASE_FINGERPRINT
          if [ "${#current_backends[@]}" -eq 1 ]; then
            backend_id=${current_backends[0]}
            backend_running=$(docker inspect --format '{{.State.Running}}' "$backend_id")
            case "$backend_running" in
              true) export EMBED_SOURCE_WRITER_ACTIVE=1 ;;
              false) ;;
              *) echo "embedding migration gate found invalid backend state" >&2; exit 1 ;;
            esac
            current_environment=$(
              docker inspect --format '{{json .Config.Env}}' "$backend_id"
            )
            jq -e 'type == "array" and all(.[]; type == "string")' \
              <<<"$current_environment" >/dev/null
            container_env_value() {
              local key=$1
              jq -r --arg prefix "${key}=" \
                '[.[] | select(startswith($prefix)) | ltrimstr($prefix)] | last // ""' \
                <<<"$current_environment"
            }
            EMBED_SOURCE_MODEL=$(container_env_value EMBED_PROVIDER_MODEL)
            EMBED_SOURCE_DIMENSIONS=$(container_env_value EMBED_PROVIDER_DIMENSIONS)
            source_mongodb_uri=$(container_env_value MONGODB_URI)
            source_mongodb_db=$(container_env_value MONGODB_DB)
            if ! EMBED_SOURCE_DATABASE_FINGERPRINT=$(
                mongodb_database_fingerprint "$source_mongodb_uri" "$source_mongodb_db"
              ); then
              unset current_environment source_mongodb_uri source_mongodb_db
              echo "embedding migration gate rejected existing backend Mongo database identity" >&2
              exit 1
            fi
            unset current_environment source_mongodb_uri source_mongodb_db
            export EMBED_SOURCE_CONTRACT_PRESENT=1
            export EMBED_SOURCE_MODEL EMBED_SOURCE_DIMENSIONS EMBED_SOURCE_DATABASE_FINGERPRINT
          fi

          docker pull "$KNOXX_BACKEND_IMAGE"
          probe_code=$(cat "$probe_dir/probe-embedding-migration.js")
          docker rm -f "$probe_container" >/dev/null 2>&1 || true
          timeout --kill-after=5s 90s docker run --rm \
            --name "$probe_container" \
            --env MONGODB_URI \
            --env MONGODB_DB \
            --env EMBED_PROVIDER_MODEL \
            --env EMBED_PROVIDER_DIMENSIONS \
            --env EMBED_SOURCE_CONTRACT_PRESENT \
            --env EMBED_SOURCE_WRITER_ACTIVE \
            --env EMBED_SOURCE_MODEL \
            --env EMBED_SOURCE_DIMENSIONS \
            --env EMBED_SOURCE_DATABASE_FINGERPRINT \
            --env EMBED_TARGET_DATABASE_FINGERPRINT \
            --workdir /app \
            --entrypoint node \
            "$KNOXX_BACKEND_IMAGE" \
            --input-type=commonjs -e "$probe_code"
          } </dev/null
          REMOTE

      - name: Sync service definition
        id: sync
        env:
          RUNTIME_PATH: ${{ steps.contract.outputs.runtime_path }}
          STATE_PATH: ${{ steps.contract.outputs.state_path }}
          SERVICE_DIR: ${{ steps.contract.outputs.service_dir }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          ssh open-hax-target "mkdir -p '${RUNTIME_PATH}' '${STATE_PATH}'"

          # Did an --itemize-changes log move anything? Transfers are itemized
          # as an 11-flag word (`>f+++++++++`, `cd+++++++++`, `hf`), but a
          # --delete removal is reported as `*deleting <path>` instead, so a
          # transfer-only pattern reads a pure deletion as "nothing changed".
          # Attribute-only lines are deliberately not counted: a leading `.`
          # means nothing was transferred, so `.f...p.....` is a chmod and
          # changes nothing the container reads at startup.
          moved() {
            grep -qE '^([<>ch][fdLDS]|\*deleting )' "$1"
          }

          # --itemize-changes so the deploy can tell whether any part of the
          # definition actually moved. compose hashes the image and the
          # environment, never the contents of a bind mount, so without this a
          # changed config file leaves the old container running untouched.
          rsync -az --delete --itemize-changes --exclude '.env' --exclude 'contracts' -e ssh \
            "${SERVICE_DIR}/" "open-hax-target:${RUNTIME_PATH}/" | tee rsync.out
          # Accumulated, then written once at the end of this step. Two writes
          # to the same GITHUB_OUTPUT key would resolve by last-write-wins,
          # which happens to be correct here but hides the dependency.
          definition_changed=0
          if moved rsync.out; then
            definition_changed=1
            echo "service definition changed; the container will be recreated"
          fi

          # Services-owned contracts ship read-only alongside the service.
          # Deploys ship contracts; they never rewrite them (receipts.edn,
          # 2026-06-02, commit 91dd693).
          #
          # Contracts are itemized and folded into definition_changed. A
          # contract is read at startup, so shipping one without recreating the
          # container leaves the running process on the old contract set — a
          # new actor would land on disk and never materialize into a
          # membership, and a withdrawn actor, role or policy would keep being
          # honoured after its file is gone. The main rsync above excludes
          # contracts, so without this a contract-only deploy reports no change
          # and recreates nothing.
          if [ -d "contracts/${SERVICE}" ]; then
            ssh open-hax-target "mkdir -p '${RUNTIME_PATH}/contracts'"
            rsync -az --delete --itemize-changes -e ssh \
              "contracts/${SERVICE}/" "open-hax-target:${RUNTIME_PATH}/contracts/" \
              | tee contracts-rsync.out
            if moved contracts-rsync.out; then
              definition_changed=1
              echo "contracts changed; the container will be recreated"
            fi
            echo "shipped $(find "contracts/${SERVICE}" -type f | wc -l) contract files"
          fi
          # .env is written separately so --delete never removes it and it
          # never travels through the repo.
          scp rendered.env "open-hax-target:${RUNTIME_PATH}/.env"
          ssh open-hax-target "chmod 600 '${RUNTIME_PATH}/.env' && chmod +x '${RUNTIME_PATH}/verify.sh'"
          if [ "$SERVICE" = knoxx ]; then
            ssh open-hax-target "chmod +x '${RUNTIME_PATH}/post-deploy.sh'"
          fi

          echo "definition_changed=${definition_changed}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          RUNTIME_PATH: ${{ steps.contract.outputs.runtime_path }}
          SERVICE: ${{ inputs.service }}
          DEFINITION_CHANGED: ${{ steps.sync.outputs.definition_changed }}
        run: |
          set -euo pipefail
          # Quoted heredoc: the script is opaque to the runner's shell and the
          # four values arrive as positional arguments on the host.
          #
          # The body is wrapped in `{ ... } </dev/null` because it reaches the
          # remote bash on stdin, and `bash -s` parses that stream lazily. Any
          # command inside that reads stdin swallows the not-yet-parsed
          # remainder of the script; bash then hits a premature EOF and exits
          # with the status of the last command it managed to run — silently
          # skipping everything after, including the failure paths. The group
          # forces a full parse before execution and hands every command inside
          # an empty stdin, so neither half of that can happen. See the health
          # gate below, where this produced a green deploy over 30 failed
          # probes (run 30679331293, 2026-08-01).
          ollama_provisioner_sha=$(sha256sum digitalocean/scripts/provision-ollama.sh | awk '{print $1}')
          ssh open-hax-target "bash -euo pipefail -s -- '$RUNTIME_PATH' '$SERVICE' '$DEFINITION_CHANGED' '$ollama_provisioner_sha'" <<'REMOTE'
          {
          runtime_path=$1
          service=$2
          definition_changed=$3
          ollama_provisioner_sha=$4
          cd "$runtime_path"

          # docker compose resolves ${VAR} from the shell environment BEFORE
          # --env-file. A stray value in the host environment would silently
          # override a rendered credential and the container would come up with
          # the wrong one, healthy and wrong. Clear every name the template
          # declares so --env-file is the only source.
          while IFS='=' read -r key _; do
            [ -n "$key" ] && unset "$key"
          done < <(grep -E '^[A-Z0-9_]+=' .env)

          # docker creates missing bind-mount sources as root, and a
          # container running unprivileged then EACCESes on its own state
          # directory (proxx /app/data, 2026-08-01). Pre-create every
          # absolute or ${VAR}-rooted volume source as the deploy user so
          # ownership is right before compose ever runs. Relative sources
          # (./Caddyfile) already exist post-rsync; named volumes are
          # docker-managed; both are skipped.
          set -a; . ./.env; set +a
          # The source may itself contain colons through required- or
          # default-value interpolation (${VAR:?msg}, ${VAR:-fallback}), so the
          # ${...} form is matched as a unit before the container path is
          # stripped. Splitting on the first colon instead yielded a truncated
          # `${VAR` whose eval failed and left mkdir with an empty argument,
          # aborting the deploy before compose ever ran.
          sed -nE 's/^[[:space:]]+- (\$\{[^}]*\}[^:"[:space:]]*|[^:"[:space:]]+):.*/\1/p' compose.yaml \
            | while IFS= read -r src; do
                case "$src" in
                  /*|\$\{*) mkdir -p "$(eval echo "$src")" ;;
                esac
              done

          # Every service shares one user-defined network so Knoxx can reach
          # Proxx by name across compose projects. Creation is idempotent.
          docker network inspect open-hax >/dev/null 2>&1 || docker network create open-hax
          # The host bootstrap owns Knoxx's dedicated Ollama bridge and exact
          # UFW source/interface rule. Never let Compose fall back to creating
          # an unparameterized network or deploy across host-boundary drift.
          if [ "$service" = knoxx ]; then
            installed_provisioner=/usr/local/sbin/open-hax-provision-ollama
            if ! installed_sha=$(sha256sum "$installed_provisioner" | awk '{print $1}'); then
              echo "cannot hash the installed Knoxx host Ollama provisioner" >&2
              exit 1
            fi
            if [ "$installed_sha" != "$ollama_provisioner_sha" ]; then
              echo "Knoxx host Ollama provisioner is absent or stale; run Bootstrap DigitalOcean Host" >&2
              exit 1
            fi
            sudo -n /usr/local/sbin/open-hax-provision-ollama --readiness
          fi
          docker compose --project-name "$service" --env-file .env pull

          # compose decides whether to recreate a container from the image and
          # the environment; the contents of a bind mount are invisible to it.
          # Worse, rsync writes a replacement and renames it, so a bind-mounted
          # *file* keeps pointing at the original inode and the running process
          # cannot see the new bytes even if it re-read them. Caddy hit both at
          # once: a corrected Caddyfile landed on the host and the container
          # went on serving the old routes, healthy and wrong (run
          # 30696778888). Recreating whenever the definition moved covers every
          # service without needing to know which files are mounted where.
          recreate=""
          if [ "$definition_changed" = "1" ]; then
            recreate="--force-recreate"
            echo "definition changed; recreating containers"
          fi
          docker compose --project-name "$service" --env-file .env up -d --remove-orphans $recreate

          # A service moved behind a disabled Compose profile is still part of
          # the configuration model, so --remove-orphans deliberately leaves an
          # older container running. Service definitions may declare those
          # migrations in disabled-profile-services. Validate that each entry
          # really is profiled, then stop and remove only that project service;
          # named volumes and durable bind-mounted state are preserved.
          if [ -f disabled-profile-services ]; then
            while IFS= read -r profile_service; do
              [ -n "$profile_service" ] || continue
              profile_count=$(docker compose --project-name "$service" --env-file .env \
                --profile '*' config --format json \
                | jq -r --arg service "$profile_service" \
                    '.services[$service].profiles // [] | length')
              if [ "$profile_count" -lt 1 ]; then
                echo "disabled profile service '$profile_service' is missing or has no profile" >&2
                exit 2
              fi
              echo "retiring disabled profile service $profile_service"
              docker compose --project-name "$service" --env-file .env \
                --profile '*' rm -sf "$profile_service"
            done < <(sed -E 's/[[:space:]]*#.*$//; /^[[:space:]]*$/d; s/^[[:space:]]+//; s/[[:space:]]+$//' \
                       disabled-profile-services)
          fi
          } </dev/null
          REMOTE


      - name: Health gate
        id: health
        env:
          RUNTIME_PATH: ${{ steps.contract.outputs.runtime_path }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          # `{ ... } </dev/null` for the reason documented on the Deploy step:
          # knoxx's verify.sh calls `docker compose exec -T`, which consumed
          # the rest of this script and turned 30 consecutive failed probes
          # into a successful deploy.
          ssh open-hax-target "bash -euo pipefail -s -- '$RUNTIME_PATH' '$SERVICE'" <<'REMOTE'
          {
          runtime_path=$1
          service=$2
          cd "$runtime_path"
          # verify.sh reads the service's own credentials to make an
          # authenticated probe; nothing is echoed.
          set -a; . ./.env; set +a
          attempts=30
          health_budget_seconds=0
          kill_grace_seconds=5
          # Knoxx's verifier has many sequential bounded requests before its
          # two 90-second Gemma canaries. Cap the complete retry loop, including
          # those requests and retry sleeps, at 15 minutes. This leaves half of
          # the 30-minute job for deployment, diagnostics, reporting, and
          # credential cleanup even when one verifier consumes most of a retry.
          if [ "$service" = knoxx ]; then
            attempts=5
            health_budget_seconds=900
          fi
          health_deadline=0
          if [ "$health_budget_seconds" -gt 0 ]; then
            health_deadline=$((SECONDS + health_budget_seconds))
          fi
          for _ in $(seq 1 "$attempts"); do
            if [ "$health_deadline" -gt 0 ]; then
              # Reserve the kill grace inside the deadline so a verifier that
              # ignores TERM cannot make the wall-clock cap aspirational.
              remaining=$((health_deadline - SECONDS - kill_grace_seconds))
              if [ "$remaining" -le 0 ]; then break; fi
              if timeout --kill-after="${kill_grace_seconds}s" "${remaining}s" ./verify.sh; then
                exit 0
              fi
            elif ./verify.sh; then
              exit 0
            fi
            sleep_seconds=6
            if [ "$health_deadline" -gt 0 ]; then
              remaining=$((health_deadline - SECONDS))
              if [ "$remaining" -le 0 ]; then break; fi
              if [ "$remaining" -lt "$sleep_seconds" ]; then sleep_seconds=$remaining; fi
            fi
            sleep "$sleep_seconds"
          done
          if [ "$health_deadline" -gt 0 ] && [ "$SECONDS" -ge "$health_deadline" ]; then
            echo "--- $service health gate exhausted its ${health_budget_seconds}s wall-clock budget ---" >&2
          fi
          echo "--- $service did not become healthy; container state ---" >&2
          docker compose --project-name "$service" --env-file .env ps >&2
          docker compose --project-name "$service" --env-file .env logs --tail 120 --no-color >&2
          exit 1
          } </dev/null
          REMOTE

      - name: Admit Knoxx publication content
        id: post_deploy
        if: inputs.service == 'knoxx'
        env:
          RUNTIME_PATH: ${{ steps.contract.outputs.runtime_path }}
        run: |
          set -euo pipefail
          # This is intentionally separate from the retrying health gate. Content
          # admission is idempotent, but it is a deployment activation and should
          # be requested exactly once after the new contracts and source anchors
          # are live, not once per readiness retry.
          ssh open-hax-target "bash -euo pipefail -s -- '$RUNTIME_PATH'" <<'REMOTE'
          {
          runtime_path=$1
          cd "$runtime_path"
          # Keep Compose interpolation pinned to the rendered environment, as in
          # the Deploy and Health gate steps. The hook sends credentials only on
          # loopback from inside the backend container and never prints them.
          set -a; . ./.env; set +a
          ./post-deploy.sh
          } </dev/null
          REMOTE

      - name: Collect deployment report
        if: always()
        env:
          RUNTIME_PATH: ${{ steps.contract.outputs.runtime_path }}
          REPORTS_ROOT: ${{ steps.contract.outputs.reports_root }}
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ inputs.image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EMBEDDING_MIGRATION_RESULT: ${{ steps.embedding_migration.outcome }}
          HEALTH_RESULT: ${{ steps.health.outcome }}
          POST_DEPLOY_RESULT: ${{ steps.post_deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh open-hax-target \
            "bash -euo pipefail -s -- '$SERVICE' '$RUNTIME_PATH' '$IMAGE' '$SOURCE_SHA' '$EMBEDDING_MIGRATION_RESULT' '$HEALTH_RESULT' '$POST_DEPLOY_RESULT' '$RUN_URL'" \
            <<'REMOTE' > report.json
          {
          service=$1; runtime_path=$2; image=$3; source_sha=$4; embedding_migration=$5; health=$6; post_deploy=$7; run_url=$8
          cd "$runtime_path"
          containers=$(docker compose --project-name "$service" ps --format json 2>/dev/null | jq -sc '.' || echo '[]')
          listening=$(ss -ltnH 2>/dev/null | awk '{print $4}' | sort -u \
            | jq -Rsc 'split("\n") | map(select(length > 0))' || echo '[]')
          jq -n \
            --arg service "$service" \
            --arg image "$image" \
            --arg sourceSha "$source_sha" \
            --arg embeddingMigration "$embedding_migration" \
            --arg health "$health" \
            --arg postDeploy "$post_deploy" \
            --arg runUrl "$run_url" \
            --arg host "$(hostname)" \
            --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson containers "$containers" \
            --argjson listening "$listening" \
            '{service: $service, image: $image, sourceSha: $sourceSha,
              embeddingMigration: $embeddingMigration,
              health: $health, postDeploy: $postDeploy, runUrl: $runUrl, host: $host,
              deployedAt: $deployedAt, containers: $containers,
              listeningSockets: $listening}'
          } </dev/null
          REMOTE
          jq . report.json
          ssh open-hax-target "mkdir -p '$REPORTS_ROOT'"
          scp report.json "open-hax-target:${REPORTS_ROOT}/${SERVICE}-$(date -u +%Y%m%dT%H%M%SZ).json"

      - name: Remove deployment credentials
        if: always()
        run: |
          ssh open-hax-target 'docker logout ghcr.io' >/dev/null 2>&1 || true
          rm -f ~/.ssh/digitalocean rendered.env

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digitalocean-deployment-${{ inputs.service }}
          path: report.json
          if-no-files-found: error

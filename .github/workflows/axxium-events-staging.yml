name: Axxium Events restart rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/axxium-events-staging.yml'
      - 'digitalocean/services/axxium/mailbox-events-production-plan.json'
      - 'scripts/axxium_events_*.py'
      - 'scripts/staging/axxium/*events_restart_fixture.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  same-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scenario: [healthy, known-failure, uncertain]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify the disposable runner and exact stage image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /srv/open-hax
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          timeout --kill-after=5s 120s gh api repos/open-hax/axxium/actions/artifacts/14366915569/zip > "$RUNNER_TEMP/candidate.zip"
          python3 -B - "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts/staging/axxium")
          from prepare_active_images import extract_role
          directory = Path(sys.argv[1])
          extract_role("candidate", directory / "candidate.zip", directory / "candidate-images.tar")
          PY
          docker load --input "$RUNNER_TEMP/candidate-images.tar"
          docker pull postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          docker pull caddy@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
      - name: Run the native transition under disposable namespace isolation
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          umask 077
          test ! -e /srv/open-hax
          case "$SCENARIO" in healthy|known-failure|uncertain) ;; *) exit 2 ;; esac
          fixture_source=$(mktemp -d /tmp/axxium-events-workspace.XXXXXXXX)
          install -d -m 700 "$fixture_source/scripts/staging/axxium" "$fixture_source/digitalocean/services/axxium"
          for file in axxium_events_profile.py axxium_events_release.py axxium_active_mailbox_release.py \
            axxium_unified_mailbox_release.py axxium_minimal_release.py axxium_ingress_host.py \
            axxium_ingress_transaction.py axxium_interrupted_handoff.py axxium_ingress_caddy.py \
            axxium_oidc_ingress.py axxium_production_qualification.py environment_policy.py github_environment_admission.py; do
            test -f "$GITHUB_WORKSPACE/scripts/$file" && test ! -L "$GITHUB_WORKSPACE/scripts/$file"
            install -m 600 "$GITHUB_WORKSPACE/scripts/$file" "$fixture_source/scripts/$file"
          done
          for file in events_restart_fixture.py active_upgrade_fixture.py prepare_active_images.py \
            network_fixture.py fixture_netns.py full_recovery_probe.py identity_fixture.py; do
            test -f "$GITHUB_WORKSPACE/scripts/staging/axxium/$file" && test ! -L "$GITHUB_WORKSPACE/scripts/staging/axxium/$file"
            install -m 600 "$GITHUB_WORKSPACE/scripts/staging/axxium/$file" "$fixture_source/scripts/staging/axxium/$file"
          done
          for file in active-mailbox-upgrade-production-plan.json unified-mailbox-production-plan.json mailbox-events-production-plan.json; do
            install -m 600 "$GITHUB_WORKSPACE/digitalocean/services/axxium/$file" "$fixture_source/digitalocean/services/axxium/$file"
          done
          install -m 600 "$RUNNER_TEMP/candidate.zip" "$fixture_source/candidate.zip"
          sudo chown -R 1000:1000 "$fixture_source"
          sudo mkdir -m 700 /srv/open-hax
          sudo chown 1000:1000 /srv/open-hax
          sudo setfacl -m u:1000:rw /var/run/docker.sock
          set +e
          sudo sh -c '
            exec 3</proc/1/ns/net
            exec unshare --net --fork setpriv --reuid=1000 --regid=1000 --clear-groups \
              env -i PATH="$2" HOME=/tmp GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
                DOCKER_HOST=unix:///var/run/docker.sock PYTHONDONTWRITEBYTECODE=1 FIXTURE_HOST_NETNS_FD=3 \
                python3 -B "$1/scripts/staging/axxium/events_restart_fixture.py" \
                  --archive "$1/candidate.zip" --scenario "$3"
          ' sh "$fixture_source" "$PATH" "$SCENARIO" | tee "$RUNNER_TEMP/events-restart-result.json"
          fixture_status=("${PIPESTATUS[@]}")
          set -e
          if [ ! -s "$RUNNER_TEMP/events-restart-result.json" ]; then
            printf '%s\n' '{"status":"failed","phase":"launch","category":"runner-no-report"}' > "$RUNNER_TEMP/events-restart-result.json"
            exit 2
          fi
          test "${fixture_status[0]}" -eq 0 && test "${fixture_status[1]}" -eq 0
      - name: Retain the sanitized rehearsal result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axxium-events-fixture-${{ matrix.scenario }}
          path: ${{ runner.temp }}/events-restart-result.json
          if-no-files-found: ignore

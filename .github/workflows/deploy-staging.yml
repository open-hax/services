name: deploy-staging

# Rebuild the entire Promethean stack on every push to staging:
# openplanner -> knoxx -> nginx -> proxx-federation-nginx.
# (The Proxx app itself deploys from open-hax/proxx; this repo owns
# topology, ingress, and the services-owned contracts the stack mounts.)

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: promethean-staging-stack
  cancel-in-progress: false

jobs:
  staging-stack-deploy:
    name: staging-stack-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - name: Checkout app sources
        run: |
          mkdir -p /tmp/open-hax
          gh repo clone open-hax/knoxx /tmp/open-hax/knoxx -- --branch staging --depth 1
          gh repo clone open-hax/openplanner /tmp/open-hax/openplanner -- --branch staging --depth 1 --recurse-submodules
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROMETHEAN_SSH_PRIVATE_KEY }}" > ~/.ssh/promethean
          chmod 600 ~/.ssh/promethean
          ssh-keyscan -H "${{ vars.PROMETHEAN_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy OpenPlanner
        env:
          DEPLOY_ENV: staging
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
          OPENPLANNER_SOURCE_ROOT: /tmp/open-hax/openplanner
        run: promethean/scripts/deploy-openplanner.sh
      - name: Deploy Knoxx (services-owned contracts)
        env:
          DEPLOY_ENV: staging
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
          KNOXX_SOURCE_ROOT: /tmp/open-hax/knoxx
        run: promethean/scripts/deploy-knoxx.sh
      - name: Deploy nginx ingress
        env:
          DEPLOY_ENV: staging
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
        run: promethean/scripts/deploy-nginx.sh
      - name: Deploy Proxx federation nginx
        env:
          DEPLOY_ENV: staging
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
        run: promethean/scripts/deploy-proxx-federation-nginx.sh
      - name: Verify staging stack
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://staging-knoxx.promethean.rest/health || true)
          echo "staging-knoxx health: $code"
          case "$code" in 200|401) ;; *) echo "staging knoxx unhealthy" >&2; exit 1 ;; esac

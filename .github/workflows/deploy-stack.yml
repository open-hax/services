name: Deploy Stack

# Manual production promotion. Stack scope requires an immutable Knoxx candidate
# and completed qualification before any host mutation. Website scope remains
# isolated behind its exact-candidate selector, staging proof and qualification.
# One production-host lock covers either complete scope.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Stack, website, Proxx, or the fixed qualified Axxium adoption
        required: false
        default: stack
        type: choice
        options: [stack, website, proxx, axxium]
      proxx_ref:
        description: open-hax/proxx ref to deploy; production defaults to the pinned SHA below
        required: false
        type: string
      knoxx_ref:
        description: Immutable merged Knoxx commit required for stack scope
        required: false
        type: string
      axxium_ref:
        description: Immutable staged Axxium source required for its fixed production adoption plan
        required: false
        type: string
      openplanner_ref:
        description: Immutable open-hax/openplanner ref used to compile Knoxx devtools
        required: false
        type: string
      website_ref:
        description: open-hax/website ref to deploy
        required: false
        default: main
        type: string
      website_image:
        description: Exact previously staged image admitted by a reviewed candidate decision; website scope only
        required: false
        type: string
      include_ingress:
        description: Stack-only Caddy deployment. Axxium uses its fixed OIDC route transaction.
        required: false
        default: true
        type: boolean
      include_website:
        description: >-
          Unsupported with stack scope; use scope=website for isolated staging.
        required: false
        default: false
        type: boolean

# packages: write is required here, not just in build-images.yml: a reusable
# workflow's jobs can never hold more than the caller's top-level permissions,
# and GitHub refuses to start the run on the mismatch.
permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: write

jobs:
  authorize:
    name: Authorize deployment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      # Scope and immutable source are admitted before the locked deploy job.
      - name: Admit the manual scope and immutable stack candidate
        id: decide
        env:
          PROXX_SHA: ${{ inputs.proxx_ref }}
          KNOXX_SHA: ${{ inputs.knoxx_ref }}
          AXXIUM_SHA: ${{ inputs.axxium_ref }}
          CALLER_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_SCOPE: ${{ inputs.scope || 'stack' }}
          INCLUDE_WEBSITE: ${{ inputs.include_website }}
          WEBSITE_IMAGE: ${{ inputs.website_image }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$DEPLOY_SCOPE" in
              stack|website|proxx|axxium) ;;
              *) echo "unknown deployment scope: $DEPLOY_SCOPE" >&2; exit 2 ;;
            esac
            if [ -n "$WEBSITE_IMAGE" ] && [ "$DEPLOY_SCOPE" != website ]; then
              echo '::error::An existing Website image requires isolated website scope.' >&2
              exit 2
            fi
            if [ "$DEPLOY_SCOPE" = stack ] && [ "$INCLUDE_WEBSITE" = true ]; then
              echo '::error::Stack deployment cannot include the website while its production qualification is unsupported. Use scope=website to stage a candidate; production remains gated.' >&2
              exit 2
            fi
            if [ "$DEPLOY_SCOPE" = stack ] && ! [[ "${KNOXX_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::Stack deployment requires an immutable Knoxx candidate.' >&2
              exit 2
            fi
            if [ "$DEPLOY_SCOPE" = proxx ]; then
              if [ "$INCLUDE_WEBSITE" = true ]; then
                echo '::error::Proxx scope cannot include the website.' >&2
                exit 2
              fi
              if [ -n "$PROXX_SHA" ] && ! [[ "$PROXX_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo '::error::Proxx scope requires an immutable source SHA.' >&2
                exit 2
              fi
            fi
            if [ "$DEPLOY_SCOPE" = axxium ]; then
              if [ "$CALLER_REF" != refs/heads/main ] || [ "$INCLUDE_WEBSITE" = true ] || ! [[ "${AXXIUM_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
                echo '::error::Axxium requires the main controller, its immutable staged source and no website opt-in.' >&2
                exit 2
              fi
            fi
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch; deploying the requested refs."
            exit 0
          fi
          echo '::error::Production deployment requires manual dispatch.' >&2
          exit 2

  # Keep the production host lock throughout qualification and deployment.
  deploy:
    name: Deploy the selected scope
    needs: authorize
    if: needs.authorize.outputs.should_deploy == 'true'
    concurrency:
      # This is the only production-host mutation queue. DigitalOcean Host is
      # verify-only when dispatched directly; its reusable bootstrap requires
      # this caller's lock attestation and therefore cannot evict a queued
      # deployment with a host-only run.
      group: digitalocean-production-host
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-stack-chain.yml
    with:
      scope: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'stack' }}
      # Pin the release source at the production entry point. A manual
      # dispatch may deliberately override this reviewed immutable default.
      proxx_ref: ${{ inputs.proxx_ref || '3ed25eec53a5bed6dc224f108323ea5d20420a22' }}
      knoxx_ref: ${{ inputs.knoxx_ref }}
      axxium_ref: ${{ inputs.axxium_ref }}
      # Keep the production default in one place. Nested reusable workflows
      # require this input instead of carrying independent, drift-prone pins.
      openplanner_ref: ${{ inputs.openplanner_ref || '07085d6557b75834ce6f50e6c54b8ca47e1c7c08' }}
      website_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.website_ref || 'main' }}
      website_image: ${{ github.event_name == 'workflow_dispatch' && inputs.website_image || '' }}
      # The manual caller can leave existing ingress unchanged.
      include_ingress: ${{ github.event_name != 'workflow_dispatch' || inputs.include_ingress }}
      # Stack opt-in is rejected in authorize;
      # explicit website scope enters its staging/qualification body.
      include_website: ${{ github.event_name == 'workflow_dispatch' && inputs.include_website }}
    secrets: inherit

name: Deploy Stack

# Brings the production stack up in dependency order.
#
#   proxx ──> knoxx ──> caddy
#
# Ordering is enforced here rather than with depends_on, because these are
# separate compose projects. It is load-bearing: the Knoxx backend's /health
# returns 503 until Proxx is reachable, and its healthcheck gates the frontend.
#
# OpenPlanner's HTTP service is deliberately absent. Knoxx runs the OpenPlanner
# data plane in-process through @open-hax/openplanner-sdk
# (KNOXX_OPENPLANNER_CLIENT_MODE=mongo) straight against Atlas, so chat,
# sessions and vector search need no OpenPlanner service. Graph, translation
# and document-stats operations still delegate to REST and degrade until one
# is deployed.
#
# The `deploy` label marks intent; the merge performs it.
#
# This used to trigger on `pull_request: types: [labeled]` and deploy the PR's
# own revision the moment the label was added. That left nowhere to put a gate:
# a check that runs on the PR cannot stand between the label and a deploy that
# has already happened, and an unreviewed revision reached production with
# production secrets. It also meant a label added for planning shipped code.
#
# Now the workflow runs on pushes to main, asks which pull request produced the
# pushed commit, and deploys only when that PR carried the `deploy` label. What
# is deployed is main, always — the same thing a reviewer approved and merged.
#
# Fork PRs need no special case any more. A fork's code only reaches this
# workflow after a maintainer merged it into main, at which point it is not a
# fork's code, it is main.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      proxx_ref:
        description: open-hax/proxx ref to deploy
        required: false
        default: main
        type: string
      knoxx_ref:
        description: open-hax/knoxx ref to deploy
        required: false
        default: main
        type: string
      include_ingress:
        description: Deploy Caddy (owns host 80/443). No DNS is changed either way.
        required: false
        default: true
        type: boolean

# packages: write is required here, not just in build-images.yml: a reusable
# workflow's jobs can never hold more than the caller's top-level permissions,
# and GitHub refuses to start the run on the mismatch.
permissions:
  contents: read
  packages: write
  # Reading which PR produced the pushed commit, and whether it was labelled.
  pull-requests: read

concurrency:
  group: deploy-stack-production
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize deployment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      # A push to main is not on its own a request to deploy. Most are not.
      # The question is whether the pull request that produced this commit
      # asked for one, which is what the `deploy` label records.
      #
      # /commits/{sha}/pulls answers it directly, and is correct for a squash
      # or rebase merge as well as a merge commit — GitHub associates the
      # resulting commit with its pull request in every case. A direct push to
      # main has no associated PR, so it returns nothing and never deploys.
      - name: Decide whether this push asked for a deployment
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch; deploying the requested refs."
            exit 0
          fi

          pulls=$(gh api "repos/${REPO}/commits/${COMMIT_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null)]')

          labelled=$(printf '%s' "$pulls" \
            | jq -r '[.[] | select(any(.labels[]?.name; . == "deploy")) | .number] | join(",")')

          if [ -n "$labelled" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploying ${COMMIT_SHA} — merged PR(s) #${labelled} carried the deploy label."
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            merged=$(printf '%s' "$pulls" | jq -r '[.[].number] | join(",")')
            echo "Not deploying ${COMMIT_SHA} — no merged PR here carried the deploy label (merged: ${merged:-none})."
          fi

  build-proxx:
    needs: authorize
    if: needs.authorize.outputs.should_deploy == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      service: proxx
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.proxx_ref || 'main' }}

  deploy-proxx:
    needs: [authorize, build-proxx]
    if: needs.authorize.outputs.should_deploy == 'true'
    uses: ./.github/workflows/deploy-digitalocean.yml
    with:
      service: proxx
      image: ${{ needs.build-proxx.outputs.image }}
      source_sha: ${{ needs.build-proxx.outputs.source_sha }}
    secrets: inherit

  # Both Knoxx images build while Proxx deploys.
  build-knoxx-backend:
    needs: authorize
    if: needs.authorize.outputs.should_deploy == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      service: knoxx-backend
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.knoxx_ref || 'main' }}

  build-knoxx-frontend:
    needs: authorize
    if: needs.authorize.outputs.should_deploy == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      service: knoxx-frontend
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.knoxx_ref || 'main' }}

  deploy-knoxx:
    needs: [authorize, deploy-proxx, build-knoxx-backend, build-knoxx-frontend]
    if: needs.authorize.outputs.should_deploy == 'true'
    uses: ./.github/workflows/deploy-digitalocean.yml
    with:
      service: knoxx
      image: ${{ needs.build-knoxx-backend.outputs.image }}
      source_sha: ${{ needs.build-knoxx-backend.outputs.source_sha }}
      # OpenPlanner REST is intentionally absent from this stack. Supply a
      # conspicuous non-secret sentinel so the shared renderer and Compose
      # contract remain strict about blank values without requiring an unused
      # production credential. If a listener unexpectedly appears, the CMS
      # probe sends this sentinel, receives a non-200 response, and fails.
      extra_env: >-
        {"KNOXX_FRONTEND_IMAGE": "${{ needs.build-knoxx-frontend.outputs.image }}", "KNOXX_EXPECT_OPENPLANNER_REST": "false", "OPENPLANNER_API_KEY": "disabled-no-openplanner-upstream"}
    secrets: inherit

  deploy-caddy:
    needs: [authorize, deploy-knoxx]
    # include_ingress only exists on workflow_dispatch; a merge deploy always
    # brings ingress with it, as the labelled-PR path used to.
    if: >-
      needs.authorize.outputs.should_deploy == 'true' &&
      (github.event_name == 'push' || inputs.include_ingress)
    uses: ./.github/workflows/deploy-digitalocean.yml
    with:
      service: caddy
    secrets: inherit

name: Deploy Stack

# Manual production promotion; the chain requires immutable Knoxx qualification.

on:
  workflow_dispatch:
    inputs:
      proxx_ref:
        description: open-hax/proxx ref to deploy; production defaults to the pinned SHA below
        required: false
        type: string
      knoxx_ref:
        description: Immutable merged Knoxx commit to qualify and deploy
        required: true
        type: string
      openplanner_ref:
        description: Immutable open-hax/openplanner ref used to compile Knoxx devtools
        required: false
        type: string
      website_ref:
        description: open-hax/website ref to deploy
        required: false
        default: main
        type: string
      include_ingress:
        description: Deploy Caddy (owns host 80/443). No DNS is changed either way.
        required: false
        default: true
        type: boolean
      include_website:
        description: >-
          Build and deploy open-hax/website. No DNS is changed either way.
        required: false
        default: true
        type: boolean

# packages: write is required here, not just in build-images.yml: a reusable
# workflow's jobs can never hold more than the caller's top-level permissions,
# and GitHub refuses to start the run on the mismatch.
permissions:
  contents: read
  packages: write

jobs:
  authorize:
    name: Authorize deployment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Require an immutable production candidate
        id: decide
        env:
          KNOXX_SHA: ${{ inputs.knoxx_ref }}
        run: |
          set -euo pipefail
          [[ "$KNOXX_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  # Keep the production host lock throughout qualification and deployment.
  deploy:
    name: Deploy proxx, knoxx, caddy, website
    needs: authorize
    if: needs.authorize.outputs.should_deploy == 'true'
    concurrency:
      # This is the only production-host mutation queue. DigitalOcean Host is
      # verify-only when dispatched directly; its reusable bootstrap requires
      # this caller's lock attestation and therefore cannot evict a queued
      # deployment with a host-only run.
      group: digitalocean-production-host
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-stack-chain.yml
    with:
      # Pin the release source at the production entry point. A manual
      # dispatch may deliberately override this reviewed default.
      proxx_ref: ${{ inputs.proxx_ref || '88471efd7f8cd27f64fc733a1c31369f00a6d432' }}
      knoxx_ref: ${{ inputs.knoxx_ref }}
      # Keep the production default in one place. Nested reusable workflows
      # require this input instead of carrying independent, drift-prone pins.
      openplanner_ref: ${{ inputs.openplanner_ref || '07085d6557b75834ce6f50e6c54b8ca47e1c7c08' }}
      website_ref: ${{ inputs.website_ref }}
      include_ingress: ${{ inputs.include_ingress }}
      include_website: ${{ inputs.include_website }}
    secrets: inherit

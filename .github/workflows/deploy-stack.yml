name: Deploy Stack

# Brings the production stack up in dependency order (proxx ──> knoxx ──>
# caddy ──> website) when a merged pull request asked for it.
#
# OpenPlanner's HTTP service is deliberately absent. Knoxx runs the OpenPlanner
# data plane in-process through @open-hax/openplanner-sdk
# (KNOXX_OPENPLANNER_CLIENT_MODE=mongo) straight against Atlas, so chat,
# sessions and vector search need no OpenPlanner service. Graph, translation
# and document-stats operations still delegate to REST and degrade until one
# is deployed.
#
# The `deploy` label marks intent; the merge performs it.
#
# This used to trigger on pushes to main, ask which pull request produced the
# pushed commit, and re-read that PR's labels when the job eventually ran.
# Two reviewers' findings retired that design:
#
# * The label check read the PR's *current* labels, so a label removed while
#   the run queued behind another deployment suppressed an intended deploy,
#   and a label added after the merge authorized one nobody requested. The
#   pull_request_target closed payload freezes the label set at merge time,
#   which is the only state that should ever authorize a deployment.
#
# * The concurrency group wrapped the whole workflow, and GitHub keeps only
#   one pending run per group — replacing it even with
#   cancel-in-progress: false. An unrelated unlabeled push could therefore
#   evict a queued labeled run and then no-op, losing the requested
#   deployment. The group now wraps only the deploy job, which unlabeled
#   merges skip entirely, so they never enter the queue. When two deploys do
#   queue, the newer replaces the older and deploys main, which already
#   contains the older run's merge, so no requested deployment is lost.
#
# pull_request_target rather than pull_request so a merged fork PR deploys in
# the base repository's context, with the secrets deployment needs. This is
# the trigger's documented-safe use: the workflow never checks out or
# executes the pull request's code. authorize reads only the event payload,
# and what is built and deployed is main, always — the same thing a reviewer
# approved and merged, which by then includes a fork's contribution as main's
# own.
#
# A direct push to main produces no event here and still never deploys.
#
# The deploy chain lives in deploy-stack-chain.yml behind one workflow_call.
# Its single production-host concurrency slot covers host provisioning and
# proxx → knoxx → caddy → website end to end, excluding independent host
# mutation for the same interval. Per-job groups would let a newer run preempt
# an older run mid-chain.

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      proxx_ref:
        description: open-hax/proxx ref to deploy; production defaults to the pinned SHA below
        required: false
        type: string
      knoxx_ref:
        description: open-hax/knoxx ref to deploy
        required: false
        default: main
        type: string
      openplanner_ref:
        description: Immutable open-hax/openplanner ref used to compile Knoxx devtools
        required: false
        type: string
      website_ref:
        description: open-hax/website ref to deploy
        required: false
        default: main
        type: string
      include_ingress:
        description: Deploy Caddy (owns host 80/443). No DNS is changed either way.
        required: false
        default: true
        type: boolean
      include_website:
        description: >-
          Build and deploy open-hax/website. No DNS is changed either way.
        required: false
        default: true
        type: boolean

# packages: write is required here, not just in build-images.yml: a reusable
# workflow's jobs can never hold more than the caller's top-level permissions,
# and GitHub refuses to start the run on the mismatch.
permissions:
  contents: read
  packages: write

jobs:
  authorize:
    name: Authorize deployment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      # Authorization comes from the event payload, not an API lookup: the
      # payload's label set is frozen when the merge happens, so the decision
      # cannot drift while the run queues behind another deployment.
      - name: Decide whether this merge asked for a deployment
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch; deploying the requested refs."
            exit 0
          fi

          if [ "$MERGED" != "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "PR #${PR_NUMBER} closed without merging; nothing to deploy."
            exit 0
          fi

          if printf '%s' "$LABELS" | jq -e 'any(.[]?.name; . == "deploy")' >/dev/null; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploying ${MERGE_SHA} — PR #${PR_NUMBER} carried the deploy label when it merged."
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Not deploying ${MERGE_SHA} — PR #${PR_NUMBER} did not carry the deploy label when it merged."
          fi

  # One job for the whole chain: the concurrency group then admits only runs
  # that actually deploy. A queued deploy is only ever replaced by a newer
  # deploy, which builds main — a superset of the run it replaced.
  deploy:
    name: Deploy proxx, knoxx, caddy, website
    needs: authorize
    if: needs.authorize.outputs.should_deploy == 'true'
    concurrency:
      # Shared with independent DigitalOcean Host runs. The nested host
      # prerequisite uses a run-local child group because this caller already
      # owns the shared lock for the complete stack deployment.
      group: digitalocean-production-host
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-stack-chain.yml
    with:
      # Pin the release source at the production entry point. A manual
      # dispatch may deliberately override it; merge-authorized deploys cannot
      # drift with the moving main branch while queued.
      proxx_ref: ${{ inputs.proxx_ref || '88471efd7f8cd27f64fc733a1c31369f00a6d432' }}
      knoxx_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.knoxx_ref || 'main' }}
      # Keep the production default in one place. Nested reusable workflows
      # require this input instead of carrying independent, drift-prone pins.
      openplanner_ref: ${{ inputs.openplanner_ref || '07085d6557b75834ce6f50e6c54b8ca47e1c7c08' }}
      website_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.website_ref || 'main' }}
      # A merge deploy always brings ingress with it, as the labelled-PR path
      # used to; only a manual dispatch can leave Caddy alone.
      include_ingress: ${{ github.event_name != 'workflow_dispatch' || inputs.include_ingress }}
      # Now `|| true` like include_ingress. open-hax/website declares
      # build:site (open-hax/website#2), which is the prerequisite this input
      # was waiting on, so a merge deploy brings the site with it. Only a
      # manual dispatch can leave it alone.
      include_website: ${{ github.event_name != 'workflow_dispatch' || inputs.include_website }}
    secrets: inherit

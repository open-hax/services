name: Deploy Stack

# Brings the production stack up in dependency order.
#
#   proxx ──> knoxx ──> caddy
#
# Ordering is enforced here rather than with depends_on, because these are
# separate compose projects. It is load-bearing: the Knoxx backend's /health
# returns 503 until Proxx is reachable, and its healthcheck gates the frontend.
#
# OpenPlanner's HTTP service is deliberately absent. Knoxx runs the OpenPlanner
# data plane in-process through @open-hax/openplanner-sdk
# (KNOXX_OPENPLANNER_CLIENT_MODE=mongo) straight against Atlas, so chat,
# sessions and vector search need no OpenPlanner service. Graph, translation
# and document-stats operations still delegate to REST and degrade until one
# is deployed.
#
# Adding the `deploy` label to a same-repository PR targeting main deploys the
# PR revision. A later update to that still-labeled PR deploys its new revision,
# so fixing a failed canary does not depend on a second label webhook. Fork PRs
# are explicitly rejected because this workflow inherits production secrets in
# its reusable deploy jobs.

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      proxx_ref:
        description: open-hax/proxx ref to deploy
        required: false
        default: main
        type: string
      knoxx_ref:
        description: open-hax/knoxx ref to deploy
        required: false
        default: main
        type: string
      openplanner_ref:
        description: Immutable open-hax/openplanner ref used to compile Knoxx devtools
        required: false
        default: 8b425c1690ada78f3f1bc5dfa28c3151e3a4fede
        type: string
      include_ingress:
        description: Deploy Caddy (owns host 80/443). No DNS is changed either way.
        required: false
        default: true
        type: boolean

# packages: write is required here, not just in build-images.yml: a reusable
# workflow's jobs can never hold more than the caller's top-level permissions,
# and GitHub refuses to start the run on the mismatch.
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-stack-production
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.state == 'open' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' && github.event.label.name == 'deploy') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'deploy'))))
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Deploying PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"
          else
            echo "Deploying manually requested refs"
          fi

  build-proxx:
    needs: authorize
    uses: ./.github/workflows/build-images.yml
    with:
      service: proxx
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.proxx_ref || 'main' }}

  deploy-proxx:
    needs: build-proxx
    uses: ./.github/workflows/deploy-digitalocean.yml
    with:
      service: proxx
      image: ${{ needs.build-proxx.outputs.image }}
      source_sha: ${{ needs.build-proxx.outputs.source_sha }}
    secrets: inherit

  # All Knoxx images build while Proxx deploys.
  build-knoxx-backend:
    needs: authorize
    uses: ./.github/workflows/build-images.yml
    with:
      service: knoxx-backend
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.knoxx_ref || 'main' }}

  build-knoxx-frontend:
    needs: authorize
    uses: ./.github/workflows/build-images.yml
    with:
      service: knoxx-frontend
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.knoxx_ref || 'main' }}

  build-knoxx-devtools:
    needs: authorize
    uses: ./.github/workflows/build-knoxx-devtools.yml
    with:
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.knoxx_ref || 'main' }}
      openplanner_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.openplanner_ref || '8b425c1690ada78f3f1bc5dfa28c3151e3a4fede' }}

  deploy-knoxx:
    needs:
      - deploy-proxx
      - build-knoxx-backend
      - build-knoxx-frontend
      - build-knoxx-devtools
    uses: ./.github/workflows/deploy-digitalocean.yml
    with:
      service: knoxx
      image: ${{ needs.build-knoxx-backend.outputs.image }}
      source_sha: ${{ needs.build-knoxx-backend.outputs.source_sha }}
      # OpenPlanner REST is intentionally absent from this stack. Supply a
      # conspicuous non-secret sentinel so the shared renderer and Compose
      # contract remain strict about blank values without requiring an unused
      # production credential. If a listener unexpectedly appears, the CMS
      # probe sends this sentinel, receives a non-200 response, and fails.
      extra_env: >-
        {"KNOXX_FRONTEND_IMAGE": "${{ needs.build-knoxx-frontend.outputs.image }}", "KNOXX_DEVTOOLS_IMAGE": "${{ needs.build-knoxx-devtools.outputs.image }}@${{ needs.build-knoxx-devtools.outputs.digest }}", "KNOXX_EXPECT_OPENPLANNER_REST": "false", "OPENPLANNER_API_KEY": "disabled-no-openplanner-upstream"}
    secrets: inherit

  deploy-caddy:
    needs: deploy-knoxx
    if: github.event_name == 'pull_request' || inputs.include_ingress
    uses: ./.github/workflows/deploy-digitalocean.yml
    with:
      service: caddy
    secrets: inherit

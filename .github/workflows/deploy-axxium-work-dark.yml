name: Deploy dark Axxium Work pilot

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      caller_holds_production_host_lock:
        required: true
        type: boolean
    secrets:
      DIGITALOCEAN_SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  PLAN: digitalocean/services/axxium-work-pilot/dark-release-plan.json

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_sha256: ${{ steps.evidence.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Admit the fixed artifact under the canonical production lock
        id: evidence
        env:
          CALLER_LOCKED: ${{ inputs.caller_holds_production_host_lock }}
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROLLER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test "$CALLER_LOCKED" = true
          test "$CALLER_WORKFLOW" = 'open-hax/services/.github/workflows/deploy-stack.yml@refs/heads/main'
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$(jq -er .source_sha "$PLAN")"
          artifact_id=$(jq -er '.artifact_id | select(type == "number" and . > 0 and floor == .)' "$PLAN")
          timeout --kill-after=5s 120s gh api "repos/open-hax/axxium/actions/artifacts/${artifact_id}/zip" > stage.zip
          python3 scripts/axxium_work_dark_admission.py --plan "$PLAN" --controller-sha "$CONTROLLER_SHA" --archive stage.zip > admission.json
          jq -e '.admitted == true' admission.json >/dev/null
          jq -r '"plan_sha256=" + (.plan_sha256 | select(test("^[0-9a-f]{64}$")))' admission.json >> "$GITHUB_OUTPUT"
      - name: Preserve sanitized admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axxium-work-dark-admission
          path: admission.json
          if-no-files-found: ignore

  deploy:
    needs: admit
    if: needs.admit.outputs.plan_sha256 != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Recheck native custody and extract the verified archive
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          EXPECTED_PLAN: ${{ needs.admit.outputs.plan_sha256 }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test "$(sha256sum "$PLAN" | cut -d' ' -f1)" = "$EXPECTED_PLAN"
          artifact_id=$(jq -er '.artifact_id | select(type == "number" and . > 0 and floor == .)' "$PLAN")
          timeout --kill-after=5s 120s gh api "repos/open-hax/axxium/actions/artifacts/${artifact_id}/zip" > stage.zip
          python3 scripts/axxium_work_dark_admission.py --plan "$PLAN" --controller-sha "$CONTROLLER_SHA" \
            --archive stage.zip --extract-image stage-images.tar > admission.json
          jq -e --arg plan "$EXPECTED_PLAN" '.admitted == true and .plan_sha256 == $plan' admission.json >/dev/null
      - name: Configure canonical pinned production SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DIGITALOCEAN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          . digitalocean/lib/host-contract.sh
          load_host_contract production
          assert_pinned_host_key
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/digitalocean
          install -m 600 "$OPEN_HAX_KNOWN_HOSTS" ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host open-hax-target
            HostName $OPEN_HAX_HOST
            User $OPEN_HAX_SSH_USER
            IdentityFile ~/.ssh/digitalocean
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 10
            ServerAliveInterval 15
            ServerAliveCountMax 4
          CONFIG
      - name: Start and verify the isolated production preflight
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          image=$(jq -er '.image_config_digest | select(test("^sha256:[0-9a-f]{64}$"))' admission.json)
          index=$(jq -er '.image_id | select(test("^sha256:[0-9a-f]{64}$"))' admission.json)
          manifest=$(jq -er '.image_manifest_digest | select(test("^sha256:[0-9a-f]{64}$"))' admission.json)
          archive=$(jq -er '.images_tar_sha256 | select(test("^[0-9a-f]{64}$"))' admission.json)
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          tar -cf controller.tar \
            scripts/axxium_work_dark_host.py digitalocean/scripts/check-axxium-production-hold.sh \
            digitalocean/services/axxium-work-pilot/compose.yaml stage-images.tar
          # Only validated hexadecimal arguments expand on the runner.
          # shellcheck disable=SC2029
          ssh open-hax-target "set -eu; umask 077; scratch=\$(mktemp -d);
            trap 'rm -rf -- \"\$scratch\"' EXIT;
            cd \"\$scratch\"; tar --no-same-owner -xf -;
            python3 scripts/axxium_work_dark_host.py --source '$SOURCE_SHA' --controller '$CONTROLLER_SHA' \
              --image '$image' --index '$index' --manifest '$manifest' --archive-sha256 '$archive'" \
            < controller.tar > release-receipt.json
          jq -e '.status == "healthy-dark" and .mailbox_active == false and .public_ingress == false' release-receipt.json >/dev/null
      - name: Preserve sanitized deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axxium-work-dark-production-receipt
          path: release-receipt.json
          if-no-files-found: ignore
      - name: Remove runner copies
        if: always()
        run: rm -f ~/.ssh/digitalocean controller.tar stage.zip stage-images.tar

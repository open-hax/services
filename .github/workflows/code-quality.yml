name: Code Quality

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  validate:
    name: Validate service definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # v13.6.1
        with:
          cli: 1.12.5.1664
      - name: Validate YAML and scripts
        run: |
          python - <<'PY'
          import pathlib, yaml
          for p in pathlib.Path('.').rglob('*.yaml'):
              yaml.safe_load(p.read_text())
              print('yaml ok', p)
          for p in pathlib.Path('.').rglob('*.yml'):
              yaml.safe_load(p.read_text())
              print('yaml ok', p)
          PY
          bash -n digitalocean/lib/*.sh digitalocean/scripts/*.sh
          bash -n digitalocean/services/*/*.sh

      - name: Parse Knoxx EDN contracts
        run: |
          clojure -M scripts/check-edn-contracts.clj
          KNOXX_DOCUMENTS_DIR=contracts/knoxx/documents \
            clojure -M digitalocean/services/knoxx/document-anchor-inventory.cljc

      - name: Enforce the DigitalOcean-only deployment boundary
        run: |
          python scripts/check-deployment-boundary.py --self-test
          python scripts/check-deployment-boundary.py

      - name: Enforce singular immutable deploy source pins
        run: python scripts/check-deploy-source-pins.py

      - name: Enforce deploy-chain failure propagation
        run: python scripts/check-deploy-chain.py

      - name: Prepare checksum-pinned Caddy configuration test tool
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          caddy_test_dir="$(mktemp -d "${RUNNER_TEMP:?}/caddy-2.8.4.XXXXXX")"
          caddy_archive="$caddy_test_dir/caddy_2.8.4_linux_amd64.tar.gz"
          # Official release asset, verified against its published SHA-512 before
          # pinning this SHA-256: https://github.com/caddyserver/caddy/releases/tag/v2.8.4
          curl --fail --location --silent --show-error --connect-timeout 20 --max-time 120 \
            --output "$caddy_archive" \
            https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz
          printf '%s  %s\n' a7e8306c54138cf88e371c5ec0caf7baf142ecc1d60a30897dfb67d65d3748c8 \
            "$caddy_archive" | sha256sum --check --strict
          tar --extract --gzip --file "$caddy_archive" --directory "$caddy_test_dir" \
            --no-same-owner caddy
          chmod 700 "$caddy_test_dir/caddy"
          test "$("$caddy_test_dir/caddy" version | cut -d' ' -f1)" = v2.8.4
          printf 'CADDY_TEST_BINARY=%s\n' "$caddy_test_dir/caddy" >> "$GITHUB_ENV"

      - name: Test service environment admission and receiver boundaries
        run: python3 -m unittest discover -s scripts/tests -p 'test_environment*.py'
      - name: Test website phase isolation and serving gates
        run: python scripts/test_website_deployment.py

      - name: Test proposed shared ingress lease and transactions
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest scripts.tests.test_identity_ingress_transaction \
            scripts.tests.test_caddy_bundle_transaction \
            scripts.tests.test_caddy_deployment_writer \
            scripts.tests.test_caddy_bootstrap_candidate \
            scripts.tests.test_caddy_host_recovery \
            scripts.tests.test_ingress_owner \
            scripts.tests.test_ingress_pending \
            scripts.tests.test_provision_ingress_owner \
            scripts.tests.test_caddy_state_candidate \
            scripts.tests.test_website_ingress_writer \
            scripts.tests.test_axxium_identity_candidate

      - name: Test exact Website owner-decision admission
        run: python scripts/test-website-owner-decision.py

      - name: Exercise website publication boundary with Nginx
        run: |
          docker pull nginxinc/nginx-unprivileged:1.27
          python scripts/test-website-serving-boundary.py
          python scripts/test-knoxx-publication-mounts.py

      - name: Enforce service environment contracts
        run: python scripts/check-env-contracts.py

      - name: Enforce disabled Compose profile retirements
        run: |
          python scripts/check-disabled-profile-services.py --self-test
          python scripts/check-disabled-profile-services.py

      - name: Self-test the Caddy dev-auth fail-closed fallback
        run: digitalocean/scripts/test-caddy-dev-auth-fallback.sh

      - name: Self-test the dev-ingress firewall verifier
        run: digitalocean/scripts/test-verify-dev-ingress-firewall.sh

      - name: Self-test the Docker readiness guard
        run: digitalocean/scripts/test-bootstrap-docker-readiness.sh

      - name: Self-test the Knoxx MCP fail-closed policy
        run: digitalocean/services/knoxx/test-mcp-verification-policy.sh

      - name: Self-test the Knoxx session-secret admission boundaries
        run: python scripts/test-knoxx-session-secret.py

      - name: Self-test the Knoxx content admission hook
        run: digitalocean/services/knoxx/test-post-deploy.sh

      - name: Self-test the Knoxx embedding contract receipt
        run: digitalocean/services/knoxx/test-embedding-contract-receipt.sh

      - name: Self-test the Knoxx event-agent limits
        run: bash digitalocean/services/knoxx/test-event-agent-limits.sh

      - name: Self-test the Mongo database identity contract
        run: bash digitalocean/services/knoxx/test-mongodb-database-identity.sh

      - name: Self-test the Knoxx Git event dispatcher boundary
        run: scripts/test-dispatch-knoxx-git-event.sh

      # Helper scripts a verify.sh evaluates inside a container. They only ever
      # run on the production host, so a syntax error in one would surface as a
      # failed health gate mid-deploy rather than here.
      - name: Check service helper scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          for js in digitalocean/services/*/*.js; do
            node --check "$js"
            echo "node --check ok $js"
          done

      # The MCP gate decodes a transport that answers text/event-stream by
      # default and classifies a tool's own failure, which MCP reports as a
      # *successful* JSON-RPC result carrying isError. Both are easy to get
      # wrong in the direction that ships green: a JSON-only reader sees an
      # empty body and a 200-means-pass reader marks every broken tool healthy.
      - name: Self-test the MCP surface decoder and classifier
        env:
          PROBE_SELFTEST: "1"
        run: node digitalocean/services/knoxx/probe-mcp.js

      - name: Self-test the Knoxx host-Ollama deployment probe
        env:
          PROBE_SELFTEST: "1"
        run: node digitalocean/services/knoxx/probe-ollama.js

      - name: Self-test the Knoxx embedding migration gate
        env:
          PROBE_SELFTEST: "1"
        run: node digitalocean/services/knoxx/probe-embedding-migration.js

      # A remote script piped to `bash -s` over ssh is parsed lazily from the
      # same stdin the script's own commands inherit. One `docker compose exec
      # -T` in a verify.sh was enough to swallow a health gate's failure
      # branch, so the gate exited 0 after 30 failed probes and reported a
      # green deploy (run 30679331293, 2026-08-01). Two invariants close it:
      # the heredoc body is a `{ ... } </dev/null` group, and no verify.sh
      # leaves an `exec` attached to stdin.
      - name: Guard remote scripts against stdin consumption
        run: |
          python - <<'PY'
          import pathlib, re, sys

          failures = []

          opener = re.compile(r"ssh\b.*\bbash\b.*(?<!\w)-s(?!\w).*<<'(?P<eof>[A-Z_]+)'")
          for wf in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              # Join shell line-continuations before matching. The report step
              # splits `ssh`, the `bash -s` command and the `<<'REMOTE'` across
              # three physical lines, and a per-line regex would never see that
              # heredoc at all.
              lines = re.sub(r'\\\n\s*', ' ', wf.read_text()).splitlines()
              i = 0
              while i < len(lines):
                  # Commented-out invocations run nothing, and this file
                  # describes the pattern in prose.
                  if lines[i].lstrip().startswith('#'):
                      i += 1
                      continue
                  m = opener.search(lines[i])
                  if not m:
                      i += 1
                      continue
                  eof = m.group('eof')
                  body = []
                  i += 1
                  while i < len(lines) and lines[i].strip() != eof:
                      body.append(lines[i].strip())
                      i += 1
                  body = [b for b in body if b and not b.startswith('#')]
                  where = f'{wf}: heredoc <<{eof}'
                  if not body or body[0] != '{':
                      failures.append(f'{where} does not open with a `{{` group')
                  if not body or body[-1] != '} </dev/null':
                      failures.append(f'{where} does not close with `}} </dev/null`')
                  i += 1

          def statements(text):
              """Split on statement newlines only.

              Line continuations are joined and newlines inside quotes are kept,
              so a `node -e "<multi-line>"` argument stays part of its command
              and the trailing redirect is seen alongside the `exec`.
              """
              out, buf, quote, i = [], [], None, 0
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if ch == '\\' and quote == '"' and i + 1 < len(text):
                          buf.append(ch); buf.append(text[i + 1]); i += 2; continue
                      if ch == quote:
                          quote = None
                      buf.append(ch)
                  elif ch in '"\'':
                      quote = ch; buf.append(ch)
                  elif ch == '\\' and i + 1 < len(text) and text[i + 1] == '\n':
                      buf.append(' '); i += 2; continue
                  elif ch == '\n':
                      out.append(''.join(buf)); buf = []
                  else:
                      buf.append(ch)
                  i += 1
              out.append(''.join(buf))
              return out

          for vs in sorted(pathlib.Path('digitalocean/services').glob('*/verify.sh')):
              for stmt in statements(vs.read_text()):
                  stmt = stmt.strip()
                  if stmt.startswith('#') or not re.search(r'docker compose\b.*\bexec\b', stmt):
                      continue
                  if not re.search(r'<\s*/dev/null', stmt):
                      failures.append(f'{vs}: `docker compose exec` does not redirect stdin: {stmt[:70]}')

          if failures:
              print('\n'.join(f'::error::{f}' for f in failures))
              sys.exit(1)
          print('remote scripts and verify hooks keep stdin closed')
          PY

name: Deploy Stack Chain

# Reusable body of deploy-stack.yml: provisions the host, then deploys proxx,
# knoxx and caddy in dependency order. Website scope uses its isolated phases.
# Image builds may run while
# host provisioning completes.
#
#   stack: proxx ──> knoxx ──> caddy; website: stage ──> proof ──> qualification
#
# Website scope requires the existing Caddy ingress and does not deploy the
# application stack. Its production qualification currently fails closed.
#
# Ordering is enforced here rather than with depends_on, because these are
# separate compose projects. It is load-bearing: the Knoxx backend's /health
# returns 503 until Proxx is reachable, and its healthcheck gates the frontend.
#
# The whole chain lives behind a single workflow_call so the caller's one
# concurrency slot covers it end to end. With per-job concurrency groups a
# newer run could preempt an older run mid-chain — cancel its next queued job
# and leave production half-advanced on the older revision.

on:
  workflow_call:
    inputs:
      scope:
        description: stack or website; website does not mutate application services
        required: false
        default: stack
        type: string
      proxx_ref:
        description: Immutable open-hax/proxx ref to deploy
        required: true
        type: string
      knoxx_ref:
        description: open-hax/knoxx ref to deploy
        required: false
        default: main
        type: string
      openplanner_ref:
        description: Immutable open-hax/openplanner ref used to compile Knoxx devtools
        required: true
        type: string
      website_ref:
        description: open-hax/website ref to deploy
        required: false
        default: main
        type: string
      include_ingress:
        description: Deploy Caddy (owns host 80/443). No DNS is changed either way.
        required: false
        default: true
        type: boolean
      include_website:
        description: >-
          Reserved stack opt-in; the canonical entrypoint rejects it until qualification exists.
        required: false
        default: false
        type: boolean

# packages: write is required here, not just in build-images.yml: a reusable
# workflow's jobs can never hold more than the caller's top-level permissions,
# and GitHub refuses to start the run on the mismatch.
permissions:
  contents: read
  packages: write

jobs:
  # Build jobs may run while the host is prepared, but no production service
  # deploy starts until this exact checkout has installed and verified the
  # provisioner it expects. deploy-stack.yml holds the production-host lock
  # across this entire chain; the required flag below attests that this nested
  # bootstrap is running inside that single production mutation queue.
  provision-host:
    if: inputs.scope == 'stack'
    uses: ./.github/workflows/digitalocean-host.yml
    with:
      operation: bootstrap
      caller_holds_production_host_lock: true
    secrets: inherit

  # The deployment consumes the immutable SHA emitted by Knoxx's own release
  # gate. This keeps application validation in Knoxx while making it an actual
  # prerequisite of both label-authorized and manually dispatched deploys.
  resolve-knoxx:
    if: inputs.scope == 'stack'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: open-hax/knoxx
          ref: ${{ inputs.knoxx_ref }}
          persist-credentials: false
      - id: source
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  knoxx-preflight:
    needs: resolve-knoxx
    uses: open-hax/knoxx/.github/workflows/deploy-production.yml@447c131bc3379e8d2199f1ab6ee0063bc8eb7f69
    with:
      source_ref: ${{ needs.resolve-knoxx.outputs.source_sha }}

  build-proxx:
    if: inputs.scope == 'stack'
    uses: ./.github/workflows/build-images.yml
    with:
      service: proxx
      source_ref: ${{ inputs.proxx_ref }}

  deploy-proxx:
    needs: [provision-host, build-proxx]
    uses: ./.github/workflows/deploy-digitalocean.yml
    with:
      service: proxx
      image: ${{ needs.build-proxx.outputs.image }}
      source_sha: ${{ needs.build-proxx.outputs.source_sha }}
      caller_holds_production_host_lock: true
    secrets: inherit

  # Both Knoxx images build while Proxx deploys.
  build-knoxx-backend:
    needs: knoxx-preflight
    uses: ./.github/workflows/build-images.yml
    with:
      service: knoxx-backend
      source_ref: ${{ needs.knoxx-preflight.outputs.source_sha }}
      openplanner_ref: ${{ inputs.openplanner_ref }}

  build-knoxx-frontend:
    needs: knoxx-preflight
    uses: ./.github/workflows/build-images.yml
    with:
      service: knoxx-frontend
      source_ref: ${{ needs.knoxx-preflight.outputs.source_sha }}

  build-knoxx-devtools:
    needs: knoxx-preflight
    uses: ./.github/workflows/build-knoxx-devtools.yml
    with:
      source_ref: ${{ needs.knoxx-preflight.outputs.source_sha }}
      openplanner_ref: ${{ inputs.openplanner_ref }}

  deploy-knoxx:
    needs: [deploy-proxx, build-knoxx-backend, build-knoxx-frontend, build-knoxx-devtools]
    uses: ./.github/workflows/deploy-digitalocean.yml
    with:
      service: knoxx
      image: ${{ needs.build-knoxx-backend.outputs.image }}@${{ needs.build-knoxx-backend.outputs.digest }}
      source_sha: ${{ needs.build-knoxx-backend.outputs.source_sha }}
      # OpenPlanner REST is intentionally absent from this stack. Garden,
      # publication and translation-review surfaces resolve from Knoxx's own
      # contracts and in-process evidence stores, and the deploy gate requires
      # them unconditionally.
      #
      # KNOXX_MCP_LOOPBACK_TOKEN is deliberately absent here: it is inherited
      # from the protected production environment. The called deploy workflow
      # fails closed before rendering if the secret is absent or too short.
      extra_env: >-
        {"KNOXX_FRONTEND_IMAGE": "${{ needs.build-knoxx-frontend.outputs.image }}@${{ needs.build-knoxx-frontend.outputs.digest }}", "KNOXX_DEVTOOLS_IMAGE": "${{ needs.build-knoxx-devtools.outputs.image }}@${{ needs.build-knoxx-devtools.outputs.digest }}"}
      caller_holds_production_host_lock: true
    secrets: inherit

  deploy-caddy:
    needs: deploy-knoxx
    if: inputs.scope == 'stack' && inputs.include_ingress
    uses: ./.github/workflows/deploy-digitalocean.yml
    with:
      service: caddy
      caller_holds_production_host_lock: true
    secrets: inherit

  # Builds alongside the rest of the chain; deploys last.
  build-website:
    if: inputs.include_website || inputs.scope == 'website'
    uses: ./.github/workflows/build-images.yml
    with:
      service: website
      source_ref: ${{ inputs.website_ref }}

  deploy-website:
    needs: [build-website, deploy-caddy]
    # deploy-caddy is conditional, and a skipped ingress must not silently skip
    # the website with it: the website's gate classifies an absent ingress as a
    # WARN owned by caddy and still proves the site serves on loopback. When
    # ingress was requested, however, a skipped Caddy means an upstream
    # dependency failed; never advance the website through that broken chain.
    if: >-
      always()
      && (inputs.include_website || inputs.scope == 'website')
      && needs.build-website.result == 'success'
      && (
        (inputs.scope == 'website' && needs.deploy-caddy.result == 'skipped')
        || (inputs.scope == 'stack' && (
          (!inputs.include_ingress && needs.deploy-caddy.result == 'skipped')
          || (inputs.include_ingress && needs.deploy-caddy.result == 'success')
        ))
      )
    uses: ./.github/workflows/deploy-website-phases.yml
    with:
      image: ${{ needs.build-website.outputs.image }}@${{ needs.build-website.outputs.digest }}
      source_sha: ${{ needs.build-website.outputs.source_sha }}
      caller_holds_production_host_lock: true
    secrets: inherit

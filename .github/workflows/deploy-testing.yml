name: deploy-testing

# Opt-in pre-merge stack rehearsal: PRs targeting staging that carry the
# `testing` label get the full stack deployed from the PR head so op-like
# and e2e behavior can be verified BEFORE the change lands in staging.
#
# Eligibility mirrors open-hax/proxx deploy-testing: requires the `testing`
# label, a ready-for-review PR, a same-repository head (fork PRs are never
# deployed), and an owner login listed in TESTING_ALLOWED_OWNER_LOGINS.
#
# The rehearsal currently targets the shared staging slot (single-host
# topology; concurrency-guarded). Dedicated testing-* slots can replace
# this once provisioned.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
    branches: [staging]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: promethean-testing-stack
  cancel-in-progress: true

jobs:
  testing-eligibility:
    name: testing-eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_deploy: ${{ steps.evaluate.outputs.should_deploy }}
      pr_head_sha: ${{ steps.evaluate.outputs.pr_head_sha }}
      pr_number: ${{ steps.evaluate.outputs.pr_number }}
    steps:
      - uses: actions/github-script@v8
        id: evaluate
        env:
          TESTING_ALLOWED_OWNER_LOGINS: ${{ vars.TESTING_ALLOWED_OWNER_LOGINS || '' }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const hasTestingLabel = pr.labels.some((label) => label.name === 'testing');

            core.setOutput('pr_head_sha', pr.head.sha);
            core.setOutput('pr_number', String(pr.number));

            if (!hasTestingLabel) {
              core.notice('Skipping testing deploy because the PR does not currently carry the `testing` label.');
              core.setOutput('should_deploy', 'false');
              return;
            }

            if (pr.draft) {
              core.setFailed('Testing deploy requires a ready-for-review PR.');
              return;
            }

            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Testing deploy only runs for same-repository PR heads; fork PRs are not eligible.');
              return;
            }

            const allowedLogins = (process.env.TESTING_ALLOWED_OWNER_LOGINS || '')
              .split(/[,\s]+/)
              .map((item) => item.trim().toLowerCase())
              .filter(Boolean);

            if (allowedLogins.length === 0) {
              core.setFailed('Configure repo/org variable TESTING_ALLOWED_OWNER_LOGINS before using the testing slot.');
              return;
            }

            if (!allowedLogins.includes(pr.user.login.toLowerCase())) {
              core.setFailed(`Testing deploy is reserved for owner-created PRs. ${pr.user.login} is not in TESTING_ALLOWED_OWNER_LOGINS.`);
              return;
            }

            core.setOutput('should_deploy', 'true');

  testing-stack-deploy:
    name: testing-stack-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [testing-eligibility]
    if: ${{ needs.testing-eligibility.outputs.should_deploy == 'true' }}
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          # Same-repo head only (enforced above); never a fork ref.
          ref: ${{ needs.testing-eligibility.outputs.pr_head_sha }}
      - name: Checkout app sources
        run: |
          mkdir -p /tmp/open-hax
          gh repo clone open-hax/knoxx /tmp/open-hax/knoxx -- --branch staging --depth 1
          gh repo clone open-hax/openplanner /tmp/open-hax/openplanner -- --branch staging --depth 1 --recurse-submodules
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROMETHEAN_SSH_PRIVATE_KEY }}" > ~/.ssh/promethean
          chmod 600 ~/.ssh/promethean
          ssh-keyscan -H "${{ vars.PROMETHEAN_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy OpenPlanner
        env:
          DEPLOY_ENV: staging
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
          OPENPLANNER_SOURCE_ROOT: /tmp/open-hax/openplanner
        run: promethean/scripts/deploy-openplanner.sh
      - name: Deploy Knoxx (services-owned contracts from PR head)
        env:
          DEPLOY_ENV: staging
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
          KNOXX_SOURCE_ROOT: /tmp/open-hax/knoxx
        run: promethean/scripts/deploy-knoxx.sh
      - name: Deploy nginx ingress
        env:
          DEPLOY_ENV: staging
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
        run: promethean/scripts/deploy-nginx.sh
      - name: Deploy Proxx federation nginx
        env:
          DEPLOY_ENV: staging
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
        run: promethean/scripts/deploy-proxx-federation-nginx.sh

  testing-live-e2e:
    name: testing-live-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [testing-eligibility, testing-stack-deploy]
    if: ${{ needs.testing-eligibility.outputs.should_deploy == 'true' }}
    steps:
      - name: Verify rehearsed stack
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://staging-knoxx.promethean.rest/health || true)
          echo "staging-knoxx health: $code"
          case "$code" in 200|401) ;; *) echo "rehearsed stack unhealthy" >&2; exit 1 ;; esac

name: Verify Services read access to the private Colab image

on:
  workflow_dispatch:

permissions: {}

jobs:
  observe:
    if: github.repository == 'open-hax/services' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify probe boundary without registry credentials
        run: python3 -m unittest scripts.tests.test_colab_registry_probe
      - name: Read exact private metadata and pull the existing immutable image
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/probe_colab_registry.py --output "$RUNNER_TEMP/colab-registry-read.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: colab-registry-read-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/colab-registry-read.json
          if-no-files-found: warn
          retention-days: 30

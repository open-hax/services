name: Deploy Promethean Service

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string
      service:
        description: service module to deploy
        required: true
        type: string
      source_repository:
        description: Source repository to deploy; defaults from service when omitted
        required: false
        type: string
        default: ""
      source_ref:
        description: Source ref/SHA to deploy; defaults to staging/main when omitted
        required: false
        type: string
        default: ""
      checkout_submodules:
        description: Whether to checkout source submodules recursively
        required: false
        type: boolean
        default: false
      services_ref:
        description: open-hax/services ref containing the deployment module
        required: false
        type: string
        default: main
    secrets:
      PROMETHEAN_SSH_PRIVATE_KEY:
        required: false
      PROMETHEAN_DEPLOY_KEY:
        required: false
      STAGING_SSH_PRIVATE_KEY:
        required: false
      PRODUCTION_SSH_PRIVATE_KEY:
        required: false
      STAGING_ENV_FILE:
        required: false
      PRODUCTION_ENV_FILE:
        required: false
      STAGING_MODELS_JSON:
        required: false
      PRODUCTION_MODELS_JSON:
        required: false
      STAGING_PROXY_AUTH_TOKEN:
        required: false
      PRODUCTION_PROXY_AUTH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      environment:
        description: staging or production
        required: true
        default: staging
        type: choice
        options: [staging, production]
      service:
        description: service module to deploy
        required: true
        type: choice
        options: [nginx, proxx, proxx-federation-nginx, knoxx, openplanner, axxium]
      source_repository:
        description: Optional app source repository override, e.g. open-hax/openplanner
        required: false
        type: string
      source_ref:
        description: Optional app source ref/SHA override
        required: false
        type: string
      checkout_submodules:
        description: Checkout app source submodules recursively
        required: false
        default: false
        type: boolean
      services_ref:
        description: open-hax/services ref containing the deployment module
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: promethean-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.service }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate inputs
        run: |
          case "${DEPLOY_ENV}" in staging|production) ;; *) echo "environment must be staging or production" >&2; exit 2 ;; esac
          case "${SERVICE}" in nginx|proxx|proxx-federation-nginx|knoxx|openplanner|axxium) ;; *) echo "unsupported service: ${SERVICE}" >&2; exit 2 ;; esac
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}

      - name: Checkout service deployment module
        uses: actions/checkout@v5
        with:
          repository: open-hax/services
          ref: ${{ inputs.services_ref || 'main' }}
          path: services

      - name: Resolve source checkout
        id: source
        run: |
          repo="${INPUT_SOURCE_REPOSITORY}"
          ref="${INPUT_SOURCE_REF}"
          if [ -z "$repo" ]; then
            case "$SERVICE" in
              proxx) repo="open-hax/proxx" ;;
              knoxx) repo="open-hax/knoxx" ;;
              openplanner) repo="open-hax/openplanner" ;;
              axxium) repo="open-hax/axxium" ;;
              *) repo="" ;;
            esac
          fi
          if [ -z "$ref" ] && [ -n "$repo" ]; then
            if [ "$DEPLOY_ENV" = production ]; then ref="main"; else ref="staging"; fi
          fi
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
          INPUT_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}

      - name: Checkout app source
        if: ${{ steps.source.outputs.repository != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          path: source
          submodules: ${{ inputs.checkout_submodules && 'recursive' || 'false' }}

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          deploy_key="${PROMETHEAN_SSH_PRIVATE_KEY:-}"
          if [ -z "$deploy_key" ] && [ "${DEPLOY_ENV}" = staging ]; then
            deploy_key="${STAGING_SSH_PRIVATE_KEY:-}"
          fi
          if [ -z "$deploy_key" ] && [ "${DEPLOY_ENV}" = production ]; then
            deploy_key="${PRODUCTION_SSH_PRIVATE_KEY:-}"
          fi
          if [ -z "$deploy_key" ]; then
            deploy_key="${PROMETHEAN_DEPLOY_KEY:-}"
          fi
          if [ -z "$deploy_key" ]; then
            echo "PROMETHEAN_SSH_PRIVATE_KEY, environment SSH key, or PROMETHEAN_DEPLOY_KEY is required" >&2
            exit 2
          fi
          printf '%s\n' "$deploy_key" > ~/.ssh/promethean
          unset deploy_key
          chmod 600 ~/.ssh/promethean
          ssh-keyscan -H "${PROMETHEAN_SSH_HOST}" >> ~/.ssh/known_hosts
        env:
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST || 'proxx.promethean.rest' }}
          DEPLOY_ENV: ${{ inputs.environment }}
          PROMETHEAN_SSH_PRIVATE_KEY: ${{ secrets.PROMETHEAN_SSH_PRIVATE_KEY }}
          PROMETHEAN_DEPLOY_KEY: ${{ secrets.PROMETHEAN_DEPLOY_KEY }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

      - name: Deploy nginx
        if: ${{ inputs.service == 'nginx' }}
        env:
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST || 'proxx.promethean.rest' }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER || 'error' }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
        run: services/promethean/scripts/deploy-nginx.sh

      - name: Deploy Proxx
        if: ${{ inputs.service == 'proxx' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST || vars.STAGING_SSH_HOST || vars.PRODUCTION_SSH_HOST || 'proxx.promethean.rest' }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER || vars.STAGING_SSH_USER || vars.PRODUCTION_SSH_USER || 'error' }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
          PROXX_SOURCE_ROOT: ${{ github.workspace }}/source
          DEPLOY_ENV_FILE: ${{ inputs.environment == 'production' && secrets.PRODUCTION_ENV_FILE || secrets.STAGING_ENV_FILE }}
          DEPLOY_MODELS_JSON: ${{ inputs.environment == 'production' && secrets.PRODUCTION_MODELS_JSON || secrets.STAGING_MODELS_JSON }}
        run: services/promethean/scripts/deploy-proxx.sh

      - name: Deploy Proxx federation nginx
        if: ${{ inputs.service == 'proxx-federation-nginx' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST || 'proxx.promethean.rest' }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER || 'error' }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
        run: services/promethean/scripts/deploy-proxx-federation-nginx.sh

      - name: Deploy Knoxx
        if: ${{ inputs.service == 'knoxx' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST || 'proxx.promethean.rest' }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER || 'error' }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
          KNOXX_SOURCE_ROOT: ${{ github.workspace }}/source
        run: services/promethean/scripts/deploy-knoxx.sh

      - name: Deploy OpenPlanner
        if: ${{ inputs.service == 'openplanner' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST || 'proxx.promethean.rest' }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER || 'error' }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
          OPENPLANNER_SOURCE_ROOT: ${{ github.workspace }}/source
        run: services/promethean/scripts/deploy-openplanner.sh

      - name: Deploy Axxium
        if: ${{ inputs.service == 'axxium' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST || 'proxx.promethean.rest' }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER || 'error' }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
          AXXIUM_SOURCE_ROOT: ${{ github.workspace }}/source
        run: services/promethean/scripts/deploy-axxium.sh

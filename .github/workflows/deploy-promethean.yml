name: Deploy Promethean Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging or production
        required: true
        default: staging
        type: choice
        options: [staging, production]
      service:
        description: service to deploy
        required: true
        type: choice
        options: [nginx, proxx-federation-nginx, knoxx, openplanner]

permissions:
  contents: read

concurrency:
  group: promethean-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.service }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - name: Checkout app sources when needed
        if: ${{ inputs.service == 'knoxx' || inputs.service == 'openplanner' }}
        run: |
          mkdir -p /tmp/open-hax
          if [ "${{ inputs.service }}" = knoxx ]; then
            gh repo clone open-hax/knoxx /tmp/open-hax/knoxx -- --branch "${{ inputs.environment == 'production' && 'main' || 'staging' }}" --depth 1
          fi
          if [ "${{ inputs.service }}" = openplanner ]; then
            gh repo clone open-hax/openplanner /tmp/open-hax/openplanner -- --branch "${{ inputs.environment == 'production' && 'main' || 'staging' }}" --depth 1 --recurse-submodules
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROMETHEAN_SSH_PRIVATE_KEY }}" > ~/.ssh/promethean
          chmod 600 ~/.ssh/promethean
          ssh-keyscan -H "${{ vars.PROMETHEAN_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy nginx
        if: ${{ inputs.service == 'nginx' }}
        env:
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
        run: promethean/scripts/deploy-nginx.sh
      - name: Deploy Proxx federation nginx
        if: ${{ inputs.service == 'proxx-federation-nginx' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
        run: promethean/scripts/deploy-proxx-federation-nginx.sh
      - name: Deploy Knoxx
        if: ${{ inputs.service == 'knoxx' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
          KNOXX_SOURCE_ROOT: /tmp/open-hax/knoxx
        run: promethean/scripts/deploy-knoxx.sh
      - name: Deploy OpenPlanner
        if: ${{ inputs.service == 'openplanner' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          PROMETHEAN_SSH_HOST: ${{ vars.PROMETHEAN_SSH_HOST }}
          PROMETHEAN_SSH_USER: ${{ vars.PROMETHEAN_SSH_USER }}
          PROMETHEAN_SSH_KEY_PATH: ~/.ssh/promethean
          OPENPLANNER_SOURCE_ROOT: /tmp/open-hax/openplanner
        run: promethean/scripts/deploy-openplanner.sh

name: eta-mu evidence review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Evidence-first review (eta-mu)
    uses: open-hax/eta-mu/.github/workflows/opencode-code-review.yml@d98ab446d56ddfd24542df49b102b851f2a767fa
    with:
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      opencode_version: '1.18.31'
      muse_revision: ba7f47dc6db26096a2a821d7a3c7ef62cb00c879
      setup_eta_mu_toolchain: false
      evidence_gates_script: |
        run_gate deployment_boundary python3 scripts/check-deployment-boundary.py
        run_gate source_pins python3 scripts/check-deploy-source-pins.py
        run_gate deployment_dependencies python3 scripts/check-deploy-chain.py
        run_gate service_environment_contracts python3 scripts/check-env-contracts.py
        run_gate disabled_profiles python3 scripts/check-disabled-profile-services.py
        run_gate website_phase_tests python3 scripts/test_website_deployment.py
        run_gate source_whitespace git diff --check "${PR_BASE_SHA}...HEAD"
    secrets:
      ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
      ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}

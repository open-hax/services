name: DigitalOcean Host

on:
  pull_request:
    paths:
      - digitalocean/**
      - .github/workflows/digitalocean-host.yml
  push:
    branches: [main]
    paths:
      - digitalocean/**
      - .github/workflows/digitalocean-host.yml
  workflow_dispatch:
    inputs:
      operation:
        description: Host operation
        required: true
        default: verify
        type: choice
        options: [bootstrap, verify]
      host:
        description: Optional Droplet IPv4 override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: digitalocean-production-host
  cancel-in-progress: false

jobs:
  validate:
    name: Validate DigitalOcean host definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate scripts, inventory, and pinned host key
        run: |
          bash -n digitalocean/scripts/bootstrap-host.sh
          bash -n digitalocean/scripts/verify-host.sh
          bash -n digitalocean/scripts/verify-dev-ingress-firewall.sh
          bash -n digitalocean/scripts/test-verify-dev-ingress-firewall.sh
          bash -n digitalocean/scripts/test-bootstrap-docker-readiness.sh
          bash -n digitalocean/scripts/provision-ollama.sh
          bash -n digitalocean/scripts/test-provision-ollama.sh
          digitalocean/scripts/test-verify-dev-ingress-firewall.sh
          digitalocean/scripts/test-bootstrap-docker-readiness.sh
          digitalocean/scripts/test-provision-ollama.sh
          python3 - <<'PY'
          import ipaddress
          from pathlib import Path

          values = {}
          for raw in Path('digitalocean/hosts/production.yaml').read_text().splitlines():
              line = raw.strip()
              if ':' not in line or line.startswith('-'):
                  continue
              key, value = line.split(':', 1)
              value = value.strip()
              if value and key not in values:
                  values[key] = value

          required = ['dropletId', 'publicAddress', 'hostKeyFingerprint', 'region', 'image', 'size']
          missing = [key for key in required if not values.get(key) or values[key] == 'null']
          if missing:
              raise SystemExit(f'missing host inventory fields: {missing}')

          address = ipaddress.ip_address(values['publicAddress'])
          if not isinstance(address, ipaddress.IPv4Address) or not address.is_global or address.is_multicast:
              raise SystemExit('publicAddress must be a global unicast IPv4 address')
          PY

          host=$(awk '$1 == "publicAddress:" { print $2; exit }' digitalocean/hosts/production.yaml)
          declared_fingerprint=$(awk '$1 == "hostKeyFingerprint:" { print $2; exit }' digitalocean/hosts/production.yaml)
          actual_fingerprint=$(ssh-keygen -lf digitalocean/known_hosts/production | awk '{print $2}')
          test "$declared_fingerprint" = "$actual_fingerprint"
          ssh-keygen -F "$host" -f digitalocean/known_hosts/production >/dev/null

  host:
    name: Bootstrap and verify production host
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Resolve target
        id: target
        env:
          INPUT_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.host || '' }}
          INPUT_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'bootstrap' }}
        run: |
          host="$INPUT_HOST"
          if [ -z "$host" ]; then
            host=$(awk '$1 == "publicAddress:" { print $2; exit }' digitalocean/hosts/production.yaml)
          fi
          HOST="$host" python3 - <<'PY'
          import ipaddress, os
          address = ipaddress.ip_address(os.environ['HOST'])
          if not isinstance(address, ipaddress.IPv4Address) or not address.is_global or address.is_multicast:
              raise SystemExit('host must be a global unicast IPv4 address')
          PY
          case "$INPUT_OPERATION" in bootstrap|verify) ;; *) exit 2 ;; esac
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "operation=$INPUT_OPERATION" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DIGITALOCEAN_SSH_PRIVATE_KEY }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean
          install -m 600 digitalocean/known_hosts/production ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          cat > ~/.ssh/config <<EOF
          Host production-droplet
            HostName $HOST
            User root
            IdentityFile ~/.ssh/digitalocean
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Bootstrap host
        if: steps.target.outputs.operation == 'bootstrap'
        run: |
          scp digitalocean/scripts/verify-dev-ingress-firewall.sh \
            production-droplet:/tmp/open-hax-verify-dev-ingress-firewall
          scp digitalocean/scripts/provision-ollama.sh \
            production-droplet:/tmp/open-hax-provision-ollama
          ssh production-droplet \
            'install -o root -g root -m 0755 /tmp/open-hax-verify-dev-ingress-firewall /usr/local/sbin/open-hax-verify-dev-ingress-firewall && install -o root -g root -m 0755 /tmp/open-hax-provision-ollama /usr/local/sbin/open-hax-provision-ollama && rm -f /tmp/open-hax-verify-dev-ingress-firewall /tmp/open-hax-provision-ollama'
          ssh production-droplet 'bash -s' < digitalocean/scripts/bootstrap-host.sh

      - name: Verify host
        run: |
          scp digitalocean/scripts/verify-host.sh production-droplet:/tmp/verify-open-hax-host.sh
          set +e
          ssh production-droplet 'chmod 700 /tmp/verify-open-hax-host.sh && REPORT=/tmp/host-verification.json /tmp/verify-open-hax-host.sh'
          status=$?
          set -e
          scp production-droplet:/tmp/host-verification.json host-verification.json || true
          exit "$status"

      - name: Remove deployment credentials
        if: always()
        run: rm -f ~/.ssh/digitalocean

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digitalocean-host-verification
          path: host-verification.json
          if-no-files-found: error

name: DigitalOcean Host

on:
  pull_request:
    paths:
      - digitalocean/**
      - .github/workflows/digitalocean-host.yml
  push:
    branches: [main]
    paths:
      - digitalocean/**
      - .github/workflows/digitalocean-host.yml
  workflow_dispatch:
    inputs:
      operation:
        description: Host operation
        required: true
        default: verify
        type: choice
        options: [bootstrap, verify]
      host:
        description: Optional Droplet IPv4 override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: digitalocean-production-host
  cancel-in-progress: false

jobs:
  validate:
    name: Validate DigitalOcean host definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate scripts and inventory
        run: |
          bash -n digitalocean/scripts/bootstrap-host.sh
          bash -n digitalocean/scripts/verify-host.sh
          python3 - <<'PY'
          import ipaddress
          from pathlib import Path

          values = {}
          for raw in Path('digitalocean/hosts/production.yaml').read_text().splitlines():
              line = raw.strip()
              if ':' not in line or line.startswith('-'):
                  continue
              key, value = line.split(':', 1)
              value = value.strip()
              if value and key not in values:
                  values[key] = value

          required = ['dropletId', 'publicAddress', 'region', 'image', 'size']
          missing = [key for key in required if not values.get(key) or values[key] == 'null']
          if missing:
              raise SystemExit(f'missing host inventory fields: {missing}')

          address = ipaddress.ip_address(values['publicAddress'])
          if not isinstance(address, ipaddress.IPv4Address) or not address.is_global or address.is_multicast:
              raise SystemExit('publicAddress must be a global unicast IPv4 address')
          PY

  probe-host-key:
    name: Probe untrusted host key
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Capture host key for out-of-band review
        run: |
          host=$(awk '$1 == "publicAddress:" { print $2; exit }' digitalocean/hosts/production.yaml)
          for _ in $(seq 1 60); do
            if ssh-keyscan -T 5 -t ed25519 "$host" > digitalocean-host-key 2>/dev/null && [ -s digitalocean-host-key ]; then
              cat digitalocean-host-key
              ssh-keygen -lf digitalocean-host-key
              exit 0
            fi
            sleep 5
          done
          echo "SSH host key did not become reachable" >&2
          exit 1

      - name: Upload untrusted host key
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digitalocean-untrusted-host-key
          path: digitalocean-host-key
          if-no-files-found: error

  host:
    name: Bootstrap and verify production host
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Resolve target
        id: target
        env:
          INPUT_HOST: ${{ github.event_name == 'workflow_dispatch' && inputs.host || '' }}
          INPUT_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'bootstrap' }}
        run: |
          host="$INPUT_HOST"
          if [ -z "$host" ]; then
            host=$(awk '$1 == "publicAddress:" { print $2; exit }' digitalocean/hosts/production.yaml)
          fi
          HOST="$host" python3 - <<'PY'
          import ipaddress, os
          address = ipaddress.ip_address(os.environ['HOST'])
          if not isinstance(address, ipaddress.IPv4Address) or not address.is_global or address.is_multicast:
              raise SystemExit('host must be a global unicast IPv4 address')
          PY
          case "$INPUT_OPERATION" in bootstrap|verify) ;; *) exit 2 ;; esac
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "operation=$INPUT_OPERATION" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DIGITALOCEAN_SSH_PRIVATE_KEY }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean
          for _ in $(seq 1 60); do
            if ssh-keyscan -T 5 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "SSH did not become reachable" >&2
          exit 1

      - name: Bootstrap host
        if: steps.target.outputs.operation == 'bootstrap'
        env:
          HOST: ${{ steps.target.outputs.host }}
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/digitalocean root@"$HOST" 'bash -s' < digitalocean/scripts/bootstrap-host.sh

      - name: Verify host
        env:
          HOST: ${{ steps.target.outputs.host }}
        run: |
          scp -i ~/.ssh/digitalocean digitalocean/scripts/verify-host.sh root@"$HOST":/tmp/verify-open-hax-host.sh
          set +e
          ssh -i ~/.ssh/digitalocean root@"$HOST" 'chmod 700 /tmp/verify-open-hax-host.sh && REPORT=/tmp/host-verification.json /tmp/verify-open-hax-host.sh'
          status=$?
          set -e
          scp -i ~/.ssh/digitalocean root@"$HOST":/tmp/host-verification.json host-verification.json || true
          exit "$status"

      - name: Remove deployment credentials
        if: always()
        run: rm -f ~/.ssh/digitalocean

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digitalocean-host-verification
          path: host-verification.json
          if-no-files-found: error

# Knoxx — the user-facing application, and the thing the demo is actually for.
#
# Isolated from the OpenPlanner HTTP service. KNOXX_OPENPLANNER_CLIENT_MODE is
# "mongo", so the data plane — health, events, sessions, vector search, mongo
# browse — runs in-process through @open-hax/openplanner-sdk straight against
# Atlas. Verified: the backend reports openplanner {reachable: true, transport:
# "sdk"} with no OpenPlanner service running anywhere.
#
# Publication contracts, Garden review, translation evidence review, and static
# reconciliation are Knoxx-owned surfaces. They do not delegate to an
# OpenPlanner HTTP service. The remaining SDK dependency is an in-process Mongo
# adapter used by broader Knoxx data-plane features.
#
# No knoxx-postgres and no knoxx-redis. The pinned backend is Mongo-only
# (infra/db/policy.cljs, infra/mongo_client.cljs; backend/package.json carries
# neither pg nor redis). They only remain a dependency of knoxx-ingestion,
# which is not deployed here. Dropping them removes two service_healthy gates
# from startup.

name: knoxx

services:
  # Agent sandboxes run against a private nested Docker daemon. The backend gets
  # no host Docker socket and therefore cannot create or mutate host containers.
  # Root inside a nested sandbox maps to the unprivileged rootless-daemon user.
  knoxx-sandboxd:
    profiles: ["sandbox"]
    image: docker:27.5.1-dind-rootless
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///run/user/1000/docker.sock
      - --tls=false
    volumes:
      - ${KNOXX_STATE_PATH}/sandbox-engine:/home/rootless/.local/share/docker
      - ${KNOXX_SANDBOX_ROOT_PATH:?KNOXX_SANDBOX_ROOT_PATH must be set}:/sandboxes
    healthcheck:
      test:
        - CMD-SHELL
        - DOCKER_HOST=tcp://127.0.0.1:2375 docker info >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    # Never join the shared open-hax network: this unauthenticated API is
    # reachable only by Knoxx backend on a project-private bridge. The bridge
    # keeps normal NAT egress so the nested daemon can pull and build images.
    networks:
      sandbox-control:
        aliases:
          - knoxx-sandboxd

  knoxx-backend:
    image: ${KNOXX_BACKEND_IMAGE:?KNOXX_BACKEND_IMAGE must be set}
    restart: unless-stopped
    depends_on:
      knoxx-sandboxd:
        condition: service_healthy
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8000"

      # In production the pi@open-hax.local fallback identity is suppressed,
      # so a missing user email turns every API-key request into a 401.
      KNOXX_API_KEY: ${KNOXX_API_KEY:?KNOXX_API_KEY must be set}
      KNOXX_API_KEY_USER_EMAIL: ${KNOXX_API_KEY_USER_EMAIL:?KNOXX_API_KEY_USER_EMAIL must be set}
      KNOXX_PUBLIC_BASE_URL: https://${KNOXX_PUBLIC_HOST}
      KNOXX_BASE_URL: https://${KNOXX_PUBLIC_HOST}
      KNOXX_PUBLICATION_SITE_URL: https://open-hax.promethean.rest

      # Browser login. The callback URL is derived from KNOXX_PUBLIC_BASE_URL as
      # /api/auth/callback/github, so the GitHub OAuth app must be registered
      # against the public hostname, not localhost.
      KNOXX_GITHUB_OAUTH_CLIENT_ID: ${KNOXX_GITHUB_OAUTH_CLIENT_ID:?KNOXX_GITHUB_OAUTH_CLIENT_ID must be set}
      KNOXX_GITHUB_OAUTH_CLIENT_SECRET: ${KNOXX_GITHUB_OAUTH_CLIENT_SECRET:?KNOXX_GITHUB_OAUTH_CLIENT_SECRET must be set}

      # Session cookies survive a redeploy only if this is pinned.
      KNOXX_SESSION_SECRET: ${KNOXX_SESSION_SECRET:?KNOXX_SESSION_SECRET must be set}

      # Shipped read-only from this repo. Deploys ship contracts; they never
      # rewrite them (receipts.edn 2026-06-02, commit 91dd693).
      CONTRACTS_DIR: /app/contracts

      # Admission-generated document and publication resources are runtime
      # state, not deploy-owned truth. Keep them on the durable writable
      # workspace while the Services contract tree remains read-only.
      KNOXX_GENERATED_CONTRACTS_DIR: ${KNOXX_GENERATED_CONTRACTS_DIR:?KNOXX_GENERATED_CONTRACTS_DIR must be set}

      # The deployed publication agents are selected with environment overlays
      # so their canonical contracts remain portable across hosts. Thinking is
      # resolved off; verify.sh separately proves native structured translation.
      KNOXX_AGENT_MODEL_OVERRIDES: ${KNOXX_AGENT_MODEL_OVERRIDES:?KNOXX_AGENT_MODEL_OVERRIDES must be set}
      KNOXX_AGENT_THINKING_OVERRIDES: ${KNOXX_AGENT_THINKING_OVERRIDES:?KNOXX_AGENT_THINKING_OVERRIDES must be set}
      # Event-triggered turns share a bounded FIFO so an anchor sweep cannot
      # open one Ollama session per emitted translation/draft event.
      KNOXX_EVENT_AGENT_CONCURRENCY: ${KNOXX_EVENT_AGENT_CONCURRENCY:?KNOXX_EVENT_AGENT_CONCURRENCY must be set}
      KNOXX_EVENT_AGENT_QUEUE_LIMIT: ${KNOXX_EVENT_AGENT_QUEUE_LIMIT:?KNOXX_EVENT_AGENT_QUEUE_LIMIT must be set}
      KNOXX_EVENT_AGENT_TURN_TIMEOUT_MS: ${KNOXX_EVENT_AGENT_TURN_TIMEOUT_MS:?KNOXX_EVENT_AGENT_TURN_TIMEOUT_MS must be set}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL must be set}

      # Required by the deployment renderer and post-deploy gate. The
      # authentication contract accepts it only from loopback, which lets the
      # probe execute inside this container without exposing another off-host
      # authentication path.
      KNOXX_MCP_LOOPBACK_TOKEN: ${KNOXX_MCP_LOOPBACK_TOKEN:?KNOXX_MCP_LOOPBACK_TOKEN must be set}

      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set}
      MONGODB_DB: ${MONGODB_DB}

      # General hosted inference goes through Proxx, which owns provider
      # credentials. The publication translator, post drafter, and in-process
      # OpenPlanner embedding client are explicit local exceptions: all reach
      # host Ollama through the host-gateway mapping below.
      PROXX_BASE_URL: http://proxx:8789
      PROXX_AUTH_TOKEN: ${PROXY_AUTH_TOKEN:?PROXY_AUTH_TOKEN must be set}
      PROXX_DEFAULT_MODEL: ${PROXX_DEFAULT_MODEL}

      # The SDK sources its own embeddings directly from host Ollama's OpenAI-
      # compatible /v1/embeddings endpoint. Do not send the Proxx credential to
      # this local provider.
      KNOXX_OPENPLANNER_CLIENT_MODE: mongo
      EMBED_PROVIDER_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL must be set}
      EMBED_PROVIDER_API_KEY: ""
      EMBED_PROVIDER_MODEL: ${EMBED_PROVIDER_MODEL}
      EMBED_PROVIDER_DIMENSIONS: ${EMBED_PROVIDER_DIMENSIONS}

      # Off for the demo: background compaction, the NPU rescorer (no such
      # hardware on a Droplet), and audio indexing.
      SEMANTIC_COMPACTION_ENABLED: "false"
      VEXX_BASE_URL: ""
      VEXX_ENFORCE: "false"
      AUDIO_INDEXING_ENABLED: "false"
      KNOXX_STT_BASE_URL: ""

      # CMS drafts, Studio media, playlists, and source hydration share one
      # durable workspace. It is intentionally separate from the image.
      WORKSPACE_ROOT: /app/workspace
      KNOXX_MUSIC_LIBRARY_ROOT: /app/workspace/Music
      OPENPLANNER_SOURCE_ROOT: /app/workspace
      OPENPLANNER_HYDRATION_LMDB_PATH: /app/state/source-hydration-lmdb

      # Where the publication target writes. Knoxx is the SINGLE writer of the
      # published content root (epic law 7); the website service mounts the same
      # directory read-only. Declared in services:docs/published-content-root.md
      # and shaped by
      # foresight:docs/notes/published-content-manifest-cross-repo-contract.md.
      #
      # Same host, so the adapter is a filesystem adapter: write the artifact,
      # then rename the manifest into place. rename(2) within one filesystem is
      # atomic, which is what lets a static file server — which has no read lock
      # — never serve a half-written manifest.
      KNOXX_PUBLICATION_CONTENT_ROOT: /srv/website-content

      # Who produces translations. `agent` runs the contract-declared
      # publication_translator through the event/trigger runtime, in-process;
      # `worker` posts a batch to the OpenPlanner ingestion worker.
      #
      # Stated explicitly even though `agent` is also the code default, because
      # this is the deployment fact that makes it correct: this stack builds
      # proxx, knoxx and caddy, and nothing else. There is no `ingestion/`
      # worker here to pick a batch up, so `worker` would leave every localized
      # intent queued forever with nothing reporting why.
      KNOXX_TRANSLATION_RUNNER: agent

      # Sandboxes use the private rootless daemon above. The same host path is
      # mounted at /sandboxes in both containers so nested bind mounts resolve
      # inside the daemon rather than against the DigitalOcean host.
      DOCKER_HOST: tcp://knoxx-sandboxd:2375
      DOCKER_USER: "0:0"
      KNOXX_SANDBOX_ROOT_DIR: /sandboxes
      KNOXX_SANDBOX_IMAGE: knoxx-sandbox:latest
      KNOXX_SANDBOX_DOCKERFILE: /runtime/sandbox/Dockerfile
      KNOXX_SANDBOX_BUILD_CONTEXT: /runtime/sandbox
      KNOXX_SANDBOX_TTL_SECONDS: "3600"
      KNOXX_SANDBOX_MAX_TTL_SECONDS: "86400"
    volumes:
      - ./contracts:/app/contracts:ro
      - ./publication-source:/app/publication-source:ro
      - ./sandbox:/runtime/sandbox:ro
      - ${KNOXX_WORKSPACE_PATH:?KNOXX_WORKSPACE_PATH must be set}:/app/workspace
      - ${KNOXX_STATE_PATH}/backend:/app/state
      - ${KNOXX_STATE_PATH}/runs:/runs/knoxx-agent
      # Read-WRITE, and the only read-write mount of this directory anywhere.
      # It is a peer of this service's state directory rather than a child of
      # it, because the reader is another service: state/website-content, not
      # state/knoxx/website-content.
      - ${WEBSITE_CONTENT_ROOT:?WEBSITE_CONTENT_ROOT must be set}:/srv/website-content
      - ${KNOXX_SANDBOX_ROOT_PATH:?KNOXX_SANDBOX_ROOT_PATH must be set}:/sandboxes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No /var/run/docker.sock. The agent sandbox needs it, but it is a
    # root-equivalent grant and this host is about to be public.
    healthcheck:
      # 401 counts as healthy: it proves the process is up and enforcing auth.
      # A 503 does not — at least one required inference/data dependency is
      # unavailable (including Proxx, Mongo/OpenPlanner, or host Ollama).
      test:
        - CMD
        - node
        - -e
        - |
          fetch('http://127.0.0.1:8000/health', {headers: {'X-API-Key': process.env.KNOXX_API_KEY || ''}})
            .then(r => process.exit(r.ok || r.status === 401 ? 0 : 1))
            .catch(() => process.exit(1))
      interval: 30s
      timeout: 15s
      retries: 10
      # The first probe is slow: it waits on upstream dependency checks.
      start_period: 120s
    networks:
      default:
        aliases:
          # The frontend image's baked nginx.conf hardcodes
          # `proxy_pass http://backend:8000/`, and nginx resolves that at
          # config load — without this alias the frontend dies on startup with
          # "host not found in upstream".
          - backend
          - knoxx-backend
      sandbox-control: {}

  # The devtools image runs a second shadow-cljs config whose :server build is a
  # side-effect-free Node runtime. Sharing the backend network namespace keeps
  # nREPL on 127.0.0.1:4500 and prevents any host or public port exposure.
  knoxx-devtools:
    image: ${KNOXX_DEVTOOLS_IMAGE:?KNOXX_DEVTOOLS_IMAGE must be set}
    restart: unless-stopped
    depends_on:
      knoxx-backend:
        condition: service_started
    network_mode: "service:knoxx-backend"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const net = require('node:net');
          const socket = net.createConnection({host: '127.0.0.1', port: 4500});
          socket.once('connect', () => { socket.end(); process.exit(0); });
          socket.once('error', () => process.exit(1));
          setTimeout(() => process.exit(1), 3000);
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  knoxx-frontend:
    image: ${KNOXX_FRONTEND_IMAGE:?KNOXX_FRONTEND_IMAGE must be set}
    restart: unless-stopped
    depends_on:
      knoxx-backend:
        condition: service_healthy
      knoxx-devtools:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        aliases:
          - knoxx-frontend

networks:
  default:
    name: open-hax
    external: true
  sandbox-control: {}

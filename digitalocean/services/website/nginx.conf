# Serving config for the website. One authority: this committed file, mounted
# read-only at /etc/nginx/conf.d/default.conf. Nothing writes config on the
# host.
#
# The base image is nginxinc/nginx-unprivileged, so this listens on 8080 and
# the worker runs as uid 101. Caddy terminates TLS, compresses (`encode zstd
# gzip`) and sets the security headers at the ingress, so none of that is
# repeated here.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Published content. The prefix is the READER's: open-hax/website's
    # domain.published declares content-root "/published" and derives every
    # manifest and artifact URL from it. `^~` so no regex location below can
    # steal these paths and reintroduce the shell fallback.
    #
    # try_files ... =404 rather than a fallback is load-bearing. The reader
    # fails loudly on a malformed manifest, and an absent manifest is the normal
    # state of every deploy before the first publication. Answering
    # /published/manifest.edn with 200 text/html would turn that ordinary state
    # into a hard reader failure; a 404 is what "nothing published yet" means.
    # The site's own shadow-cljs :dev-http carries the same exclusion, so dev
    # and production agree.
    location ^~ /published/ {
        try_files $uri =404;

        # Published bytes change without changing their URL only when a
        # revision is republished; the manifest itself changes on every
        # publication and must never be served from a stale cache.
        add_header Cache-Control "no-cache" always;

        # Artifacts carry real extensions (.html, .css, .svg) and are typed by
        # the MIME map. Anything unmapped stays octet-stream rather than
        # inheriting a guess.
        default_type application/octet-stream;

        # The manifest is EDN. nginx's mime.types has no entry for it, and
        # octet-stream is read correctly by fetch().text() while misleading
        # every human who opens it in a browser. Scoped to a nested location so
        # the surrounding MIME map is untouched: a `types { ... }` block in this
        # context would REPLACE the inherited map, not extend it, and would take
        # text/html and text/css down with it.
        location ~ \.edn$ {
            try_files $uri =404;
            default_type application/edn;
            add_header Cache-Control "no-cache" always;
        }
    }

    # Media assets. Stable names, large bytes, changed only by a release.
    # services#19 marked these `immutable`; that is wrong for unhashed names, so
    # they are cacheable-but-revalidatable instead.
    # `add_header` alone rather than `expires`: `expires` emits its own
    # Cache-Control and the pair produced two conflicting headers on the same
    # response.
    location ~ ^/(graphics|music)/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # The compiled app and its stylesheet. shadow-cljs emits /cljs/app.js under
    # a stable name, so a long max-age would pin browsers to a stale release.
    # ETag revalidation costs one 304.
    location ~ \.(js|css|map)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Locale-prefixed client routes must retain their locale. The per-locale
    # shells carry localized lang, title and canonical metadata; falling through
    # to /index.html would serve the default locale for /es/notes/hello. A
    # missing locale shell is a deployment defect, so it is a 404 rather than a
    # default-locale fallback.
    location = /es {
        try_files /es/index.html =404;
    }
    location ^~ /es/ {
        try_files $uri $uri/ @es-shell;
    }
    location @es-shell {
        try_files /es/index.html =404;
    }

    location = /fr {
        try_files /fr/index.html =404;
    }
    location ^~ /fr/ {
        try_files $uri $uri/ @fr-shell;
    }
    location @fr-shell {
        try_files /fr/index.html =404;
    }

    location = /de {
        try_files /de/index.html =404;
    }
    location ^~ /de/ {
        try_files $uri $uri/ @de-shell;
    }
    location @de-shell {
        try_files /de/index.html =404;
    }

    location = /ja {
        try_files /ja/index.html =404;
    }
    location ^~ /ja/ {
        try_files $uri $uri/ @ja-shell;
    }
    location @ja-shell {
        try_files /ja/index.html =404;
    }

    # Locale routing and client-routed document paths. `$uri/` comes before the
    # fallback on purpose: if a release ever emits a real per-locale directory
    # (dist/site/es/index.html) it is served as itself, and only paths with no
    # file behind them reach the shell.
    #
    # The shell is what makes an empty content root a valid state — the site's
    # own copy is compiled into the bundle and does not come through the
    # publication seam.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

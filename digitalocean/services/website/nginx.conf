# Serving config for the website. One authority: this committed file, mounted
# read-only at /etc/nginx/conf.d/default.conf. Nothing writes config on the
# host.
#
# The base image is nginxinc/nginx-unprivileged, so this listens on 8080 and
# the worker runs as uid 101. Caddy terminates TLS, compresses (`encode zstd
# gzip`) and sets the security headers at the ingress, so none of that is
# repeated here.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx normalizes dot segments before choosing a location. Refuse traversal
    # in the raw path, including encoded dots/slashes, before it can escape the
    # published boundary and reach the app shell. A query string is not a path.
    if ($request_uri ~* "^[^?]*(/|%2f)(\.|%2e){2}(/|%2f|\?|$)") {
        return 404;
    }

    # The writer root also contains private CMS history, untranslated source,
    # translation candidates, and idempotency records. A read-only mount protects
    # their bytes from mutation, not disclosure. Only the manifest and the public
    # artifact subtree belong to the reader's /published URL surface.
    location = /published {
        return 404;
    }

    # An absent manifest means "nothing published yet", never the app shell.
    # Clear the MIME map only here so EDN does not change HTML/CSS artifact types.
    location = /published/manifest.edn {
        disable_symlinks on;
        try_files $uri =404;
        types { }
        default_type application/edn;
        add_header Cache-Control "no-cache" always;
    }

    # The canonical writer emits artifacts/<document>/<locale>/<revision>.<ext>.
    # `^~` keeps the asset regexes below from replacing the publication policy.
    # Hidden entries are private even inside this subtree; symlinks cannot make
    # private siblings or files outside the writer root into public artifacts.
    location ^~ /published/artifacts/ {
        location ~ /\. {
            return 404;
        }

        disable_symlinks on;
        try_files $uri =404;

        # Manifest and artifact URLs can be republished without a URL change.
        add_header Cache-Control "no-cache" always;
        default_type application/octet-stream;
    }

    # Deny every other writer-root path, including .ημ, .translations,
    # .idempotency, cms source/metadata, and arbitrary EDN files. The allowlist
    # above and this fallback must never redirect into the single-page shell.
    location ^~ /published/ {
        return 404;
    }

    # Media assets. Stable names, large bytes, changed only by a release.
    # services#19 marked these `immutable`; that is wrong for unhashed names, so
    # they are cacheable-but-revalidatable instead.
    # `add_header` alone rather than `expires`: `expires` emits its own
    # Cache-Control and the pair produced two conflicting headers on the same
    # response.
    location ~ ^/(graphics|music)/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # The compiled app and its stylesheet. shadow-cljs emits /cljs/app.js under
    # a stable name, so a long max-age would pin browsers to a stale release.
    # ETag revalidation costs one 304.
    location ~ \.(js|css|map)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Locale-prefixed client routes must retain their locale. The per-locale
    # shells carry localized lang, title and canonical metadata; falling through
    # to /index.html would serve the default locale for /es/notes/hello. A
    # missing locale shell is a deployment defect, so it is a 404 rather than a
    # default-locale fallback.
    location = /es {
        try_files /es/index.html =404;
    }
    location ^~ /es/ {
        try_files $uri $uri/ @es-shell;
    }
    location @es-shell {
        try_files /es/index.html =404;
    }

    location = /fr {
        try_files /fr/index.html =404;
    }
    location ^~ /fr/ {
        try_files $uri $uri/ @fr-shell;
    }
    location @fr-shell {
        try_files /fr/index.html =404;
    }

    location = /de {
        try_files /de/index.html =404;
    }
    location ^~ /de/ {
        try_files $uri $uri/ @de-shell;
    }
    location @de-shell {
        try_files /de/index.html =404;
    }

    location = /ja {
        try_files /ja/index.html =404;
    }
    location ^~ /ja/ {
        try_files $uri $uri/ @ja-shell;
    }
    location @ja-shell {
        try_files /ja/index.html =404;
    }

    # Locale routing and client-routed document paths. `$uri/` comes before the
    # fallback on purpose: if a release ever emits a real per-locale directory
    # (dist/site/es/index.html) it is served as itself, and only paths with no
    # file behind them reach the shell.
    #
    # The shell is what makes an empty content root a valid state — the site's
    # own copy is compiled into the bundle and does not come through the
    # publication seam.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

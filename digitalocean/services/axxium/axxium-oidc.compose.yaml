# Optional, operator installed; selected only after receiver private-file preflight.
services:
  axxium:
    environment:
      AXXIUM_OIDC_CONFIG_FILE: /run/axxium/oidc/authority.json
    volumes:
      - type: bind
        source: ${AXXIUM_STATE_PATH}/oidc
        target: /run/axxium/oidc
        read_only: true
        bind:
          create_host_path: false

# Combine with the Services production topology and optional OIDC mount.
# Axxium trusts only the dedicated Caddy peer. PDS and database are unchanged.
services:
  axxium:
    environment:
      AXXIUM_TRUST_PROXY: 172.30.115.2
    networks:
      axxium-identity-ingress:
        ipv4_address: 172.30.115.3
        aliases: [axxium-identity-ingress]

networks:
  axxium-identity-ingress:
    name: axxium-identity-ingress
    external: true

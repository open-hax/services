# Caddy — the single owner of host ports 80 and 443.
#
# Chosen over the legacy nginx path (promethean/nginx/promethean.conf plus a
# certbot/dns-cloudflare sidecar) because that arrangement needs Cloudflare API
# credentials resident on the host and a wildcard certificate held as host
# state. Three hostnames and HTTP-01 need neither. The promethean.rest records
# are DNS-only rather than proxied, so ACME reaches the origin directly.
#
# Exactly one ingress owner, per #27.

name: caddy

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_KNOXX_HOST: ${KNOXX_PUBLIC_HOST:?KNOXX_PUBLIC_HOST must be set}
      CADDY_PROXX_HOST: ${PROXX_PUBLIC_HOST:?PROXX_PUBLIC_HOST must be set}
      CADDY_WEBSITE_HOST: ${WEBSITE_PUBLIC_HOST:?WEBSITE_PUBLIC_HOST must be set}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL must be set}
      CADDY_KNOXX_DEV_HOST: ${CADDY_KNOXX_DEV_HOST:?CADDY_KNOXX_DEV_HOST must be set}
      CADDY_OPENCODE_DEV_HOST: ${CADDY_OPENCODE_DEV_HOST:?CADDY_OPENCODE_DEV_HOST must be set}
      CADDY_SHADOW_DEV_HOST: ${CADDY_SHADOW_DEV_HOST:?CADDY_SHADOW_DEV_HOST must be set}
      # Keep the `:?` guards. Without them, an unset hash would render the
      # basic_auth directive with an empty credential, which Caddy accepts and
      # which authenticates nobody against nothing — an open door, not an error.
      DEV_BASIC_AUTH_USER: ${DEV_BASIC_AUTH_USER:?DEV_BASIC_AUTH_USER must be set}
      DEV_BASIC_AUTH_HASH: ${DEV_BASIC_AUTH_HASH:?DEV_BASIC_AUTH_HASH must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state. Losing this means re-issuing, and
      # Let's Encrypt rate limits are per-hostname-per-week.
      - ${CADDY_STATE_PATH}/data:/data
      - ${CADDY_STATE_PATH}/config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      default:
        aliases:
          - caddy
      # The fixed address is the firewall identity for host-resident dev
      # services. Do not attach any other container to this network.
      dev-ingress:
        ipv4_address: 172.31.255.2

networks:
  default:
    name: open-hax
    external: true
  dev-ingress:
    name: caddy-dev-ingress
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.255.0/28
          gateway: 172.31.255.1

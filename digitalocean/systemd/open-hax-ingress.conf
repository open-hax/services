# Candidate systemd-tmpfiles definitions. `f` creates only if absent; it does
# not replace the live lock inode. Neither this file nor the unit is installed.
d /run/open-hax 0755 root root -
d /run/open-hax/ingress 0755 root root -
f /run/open-hax/ingress/transaction.lock 0644 root root -
d /etc/open-hax/ingress 0755 root root -
d /var/lib/open-hax/ingress 0700 root root -
d /var/lib/open-hax/ingress/bootstrap 0700 root root -

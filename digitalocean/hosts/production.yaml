version: 1
provider: digitalocean
environment: production

host:
  name: open-hax-services-production
  dropletId: 588977221
  publicAddress: 157.245.125.134
  privateAddress: 10.108.0.2
  sshUser: deploy
  bootstrapUser: root
  hostKeyFingerprint: SHA256:HKUMqjMeeJsIlZRqO++z5xx0pBqtLi8GOBFKZ6GomQY
  region: nyc3
  image: ubuntu-24-04-x64
  size: s-4vcpu-8gb
  backups: true
  monitoring: true
  tags:
    - open-hax
    - services
    - production

runtime:
  root: /srv/open-hax
  servicesRoot: /srv/open-hax/services
  stateRoot: /srv/open-hax/state
  configRoot: /srv/open-hax/config
  reportsRoot: /srv/open-hax/reports

storage:
  mongodb:
    required: true
    mode: external
    connectionSecret: MONGODB_URI
  vectors:
    required: false
    backend: disabled
    connectionSecret: VECTOR_DATABASE_URL

inference:
  gateway: proxx
  localRuntime:
    engine: ollama
    version: "0.33.2"
    bind: docker-default-gateway
    models:
      - id: "gemma4:e2b"
        digest: 7fbdbf8f5e45a75bb122155ed546e765b4d9c53a1285f62fd9f506baa1c5a47e
      - id: "nomic-embed-text:latest"
        digest: 0a109f422b47e3a30ba2b10eca18548e944e8a23073ee3f3e947efcf3c45e59f
  providerSecrets:
    - REQUESTY_API_KEY

roles:
  - ingress
  - proxx
  - knoxx
  - website

services:
  axxium:
    image: ${AXXIUM_IMAGE:?Set an immutable built Axxium image}
    restart: unless-stopped
    # Covers startup shutdown: 2 * 300s maximum statement timeout + 5s.
    stop_grace_period: 610s
    ports:
    - 127.0.0.1:${AXXIUM_LISTEN_PORT:-18877}:8787
    environment:
      NODE_ENV: production
      AXXIUM_HOST: 0.0.0.0
      AXXIUM_PORT: 8787
      AXXIUM_PUBLIC_BASE_URL: ${AXXIUM_PUBLIC_BASE_URL:?Set the public environment
        hostname}
      DB_HOST: database
      DB_NAME: axxium
      DB_USER: axxium
      DB_PASSWORD: ${DB_PASSWORD:?Set an instance-specific database password}
      JWT_SECRET: ${JWT_SECRET:?Set an instance-specific session secret}
      JWT_ISSUER: ${AXXIUM_PUBLIC_BASE_URL}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      AXXIUM_IDENTITY_KEY_FILE: /run/axxium/identity-private.json
      AXXIUM_IDENTITY_TRUST_FILE: /run/axxium/trust.json
      AXXIUM_OIDC_CONFIG_FILE: /run/axxium/oidc/authority.json
      AXXIUM_TRUST_PROXY: ${AXXIUM_TRUST_PROXY:?Set the exact trusted staging ingress peer}
    volumes:
    - ./identity-private.json:/run/axxium/identity-private.json:ro
    - ./trust.json:/run/axxium/trust.json:ro
    - type: bind
      source: ./oidc
      target: /run/axxium/oidc
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 4
    mem_limit: 192m
    cpus: '1.0'
    pids_limit: 160
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cap_drop:
    - ALL
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: axxium
      POSTGRES_USER: axxium
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U axxium -d axxium
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 192m
    cpus: '1.0'
    pids_limit: 160
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres-data: null

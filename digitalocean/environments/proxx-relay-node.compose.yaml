# Outbound machine-only scoped node. Local provider/admin credentials stay local.
services:
  proxx:
    environment:
      AXXIUM_RELAY_NODE_ISSUER: ${AXXIUM_RELAY_NODE_ISSUER:?Fixed shared issuer required}
      AXXIUM_RELAY_NODE_AUDIENCE: ${AXXIUM_RELAY_NODE_AUDIENCE:?Exact broker origin required}
      AXXIUM_RELAY_NODE_ID: ${AXXIUM_RELAY_NODE_ID:?Distinct operator node ID required}
      AXXIUM_RELAY_NODE_SECRET: ${AXXIUM_RELAY_NODE_SECRET:?Private node credential required}
      AXXIUM_RELAY_NODE_SUBJECT: ${AXXIUM_RELAY_NODE_SUBJECT:?Verified active owner subject required}
      FEDERATION_BRIDGE_RELAY_URL: wss://proxx.promethean.rest/api/ui/federation/bridge/ws
